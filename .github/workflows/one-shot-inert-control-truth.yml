name: One-shot inert control truth

on:
  push:
    branches:
      - fix/p1-inert-control-truth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-inert-control-truth
          fetch-depth: 0
      - name: Apply control truth patch
        run: python scripts/one-shot-inert-control-truth.py
      - name: Validate JavaScript and control contracts
        run: |
          node --check app.js
          node --check ui-actions.js
          grep -F "Refresh Status · Preview" app.js
          grep -F "＋ Add Store · Preview" app.js
          grep -F "Close Preview" app.js
          grep -F "Invite User · Preview" app.js
          grep -F "Placements · Preview" app.js
          grep -F "Sample Filters · Preview" app.js
          grep -F "global-keyword-search" ui-actions.js
          grep -F "markStaticShellTruth" ui-actions.js
          ! grep -F "Store workspace preview created." app.js
          ! grep -F "OAuth backend will be connected in the API phase." app.js
      - name: Remove temporary patch assets and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-inert-control-truth.yml scripts/one-shot-inert-control-truth.py
          git add app.js ui-actions.js
          git commit -m "Make inactive controls explicit or functional"
          git push origin HEAD:fix/p1-inert-control-truth
