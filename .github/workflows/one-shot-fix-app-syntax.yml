name: One-shot app syntax repair

on:
  push:
    branches:
      - fix/app-js-syntax-gate

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-js-syntax-gate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Repair exact syntax defect and extend syntax gate
        shell: python
        run: |
          from pathlib import Path
          import json

          app_path = Path('app.js')
          text = app_path.read_text(encoding='utf-8')
          bad = "].join('\n');download(`KeywordOS_global_keywords_"
          good = "].join('\\n');download(`KeywordOS_global_keywords_"
          count = text.count(bad)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed global-keyword CSV join, found {count}')
          app_path.write_text(text.replace(bad, good, 1), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          check = package['scripts']['check']
          if 'node --check app.js' not in check:
              marker = 'node --check runtime-capabilities.js'
              if marker not in check:
                  raise SystemExit('Expected runtime-capabilities syntax check marker not found')
              package['scripts']['check'] = check.replace(marker, 'node --check app.js && ' + marker, 1)
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

      - name: Verify repaired browser entrypoint
        run: |
          node --check app.js
          npm run check

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-app-syntax.yml
          git add app.js package.json
          git commit -m "Fix app entrypoint syntax and add syntax gate"
          git push origin HEAD:fix/app-js-syntax-gate
