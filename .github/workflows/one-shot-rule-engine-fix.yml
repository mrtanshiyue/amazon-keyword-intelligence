name: One-shot structured rule engine fix

on:
  push:
    branches:
      - fix/p1-structured-rule-engine

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-structured-rule-engine
          fetch-depth: 0
      - name: Replace legacy rule execution with structured engine
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          def replace_until(source, start, end, replacement):
              pattern = re.escape(start) + r'.*?(?=' + re.escape(end) + r')'
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one block from {start!r} to {end!r}, found {count}')
              return updated

          rules_block = r'''function renderAnalyticsSummary(){return''}
          function ruleEngine(r){return r&&r.engine&&r.engine.version===1?r.engine:null;}
          function ruleExecutable(r){return Boolean(ruleEngine(r))&&['Keyword Harvest','Negative Targeting'].includes(r.type);}
          function ruleMetricValue(item,metric){if(metric==='acosPct')return item.acos==null?null:item.acos*100;return Number(item[metric]);}
          function ruleCompare(value,op,target){if(value==null||!Number.isFinite(Number(value)))return false;value=Number(value);target=Number(target);if(op==='>=')return value>=target;if(op==='<=')return value<=target;if(op==='>')return value>target;if(op==='<')return value<target;return value===target;}
          function ruleMatches(item,engine){return (engine.all||[]).every(c=>ruleCompare(ruleMetricValue(item,c.metric),c.op,c.value));}
          function ruleConditionText(engine){const labels={orders:'Orders',clicks:'Clicks',spend:'Spend',acosPct:'ACoS'};return (engine?.all||[]).map(c=>`${labels[c.metric]||c.metric} ${c.op} ${c.value}${c.metric==='acosPct'?'%':''}`).join(' AND ');}
          function renderRules(){const tabs=['Apply Rules','Bid','Keyword Harvest','Negative Targeting','Budget'];let rules=state.rules;if(state.ruleTab!=='Apply Rules')rules=rules.filter(x=>x.type===state.ruleTab);const executable=state.rules.filter(ruleExecutable).length,legacy=state.rules.filter(r=>!ruleExecutable(r)).length;$('#content').innerHTML=`<div class="rule-page"><div class="section-tabs">${tabs.map(t=>`<button class="section-tab ${state.ruleTab===t?'active':''}" data-rule-tab="${t}">${t}</button>`).join('')}</div><div class="rules-head"><div><b style="font-size:12px">${state.ruleTab}</b><div class="small muted">${executable} structured rule(s) executable · ${legacy} legacy/draft rule(s) review-only · outputs always stage to Action Center.</div></div><div class="right"><button class="btn" id="run-rules">▶ Run Executable Rules</button><button class="btn primary" id="create-rule">＋ Create Rule</button></div></div>${state.ruleTab==='Apply Rules'?renderApplyRules():rules.length?rules.map(renderRuleRow).join(''):`<div class="empty-state"><div class="empty-icon">⚡</div><h3>No ${state.ruleTab} rules yet</h3><p>Create a structured rule to standardize recommendation generation.</p></div>`}</div>`;
            $$('[data-rule-tab]').forEach(b=>b.addEventListener('click',()=>{state.ruleTab=b.dataset.ruleTab;render();}));
            $('#create-rule')?.addEventListener('click',openCreateRule);
            $('#run-rules')?.addEventListener('click',runRules);
            $$('[data-rule-toggle]').forEach(t=>t.addEventListener('click',()=>{const r=state.rules.find(x=>x.id===t.dataset.ruleToggle);if(!r)return;if(!ruleExecutable(r)){r.status='Draft';save(STORAGE.rules,state.rules);toast('Legacy or unsupported rules stay Draft until migrated to structured criteria.','warn');return render();}r.status=r.status==='Enabled'?'Paused':'Enabled';save(STORAGE.rules,state.rules);render();}));
            $$('[data-rule-open]').forEach(b=>b.addEventListener('click',()=>openRuleDetail(state.rules.find(x=>x.id===b.dataset.ruleOpen))));
          }
          '''
          text = replace_until(text, "function renderAnalyticsSummary(){return''}", 'function renderApplyRules()', rules_block)

          rule_row = r'''function renderRuleRow(r){const engine=ruleEngine(r),executable=ruleExecutable(r);const status=executable?r.status:'Draft';const condition=engine?ruleConditionText(engine):(r.condition||'Legacy free-text condition · migration required');const action=executable?(r.type==='Keyword Harvest'?'Stage Add Exact Keyword':'Stage Negative Exact'):(r.action||'Review only');return `<div class="rule-row"><div class="rule-name"><b><span class="entity-link" data-rule-open="${r.id}">${esc(r.name)}</span></b><small>${esc(condition)} → ${esc(action)}</small></div><div class="rule-cell"><label>Lookback</label><span>${esc(r.lookback||'Current range')}</span></div><div class="rule-cell"><label>Frequency</label><span>${esc(r.frequency||'Manual run')}</span></div><div class="rule-cell"><label>Scope</label><span>${esc(r.scope||'All campaigns')}</span></div><div class="rule-cell"><label>Engine</label><span>${executable?badge('Structured v1','green'):badge('Draft / migrate','amber')}</span></div><div><span class="toggle ${status==='Enabled'?'on':''}" data-rule-toggle="${r.id}" title="${executable?'Enable or pause rule':'Legacy/draft rule is not executable'}"></span></div></div>`;}
          '''
          text = replace_until(text, 'function renderRuleRow(r)', 'function openCreateRule()', rule_row)

          create_rule = r'''function openCreateRule(){openModal('Create Structured Rule',`<div class="form-grid"><div class="form-field"><label>Rule Type</label><select id="rule-type" class="select"><option>Keyword Harvest</option><option>Negative Targeting</option><option>Bid</option><option>Budget</option></select></div><div class="form-field"><label>Rule Name</label><input id="rule-name" class="input" value="New PPC Rule"></div><div class="form-field"><label>Lookback</label><select id="rule-lookback" class="select"><option>7 days</option><option>14 days</option><option selected>30 days</option><option>60 days</option></select></div><div class="form-field"><label>Frequency</label><select id="rule-frequency" class="select"><option>Manual run</option><option>Daily review</option><option>Weekly review</option></select></div><div class="form-field"><label>Minimum Orders</label><input id="rule-orders" class="input" type="number" min="0" value="${state.settings.harvestOrders}"></div><div class="form-field"><label>Maximum ACoS (%)</label><input id="rule-acos" class="input" type="number" min="0" value="${state.settings.harvestAcos}"></div><div class="form-field"><label>Minimum Clicks</label><input id="rule-clicks" class="input" type="number" min="0" value="${state.settings.negativeClicks}"></div><div class="form-field"><label>Minimum Spend ($)</label><input id="rule-spend" class="input" type="number" min="0" step="0.01" value="${state.settings.negativeSpend}"></div><div class="form-field full"><label>Scope</label><input id="rule-scope" class="input" value="All campaigns"></div><div class="notice-banner full">Keyword Harvest uses Minimum Orders + Maximum ACoS. Negative Targeting uses Orders = 0 + Minimum Clicks + Minimum Spend. Bid and Budget can be authored but remain Draft until a structured adjustment model is implemented.</div></div>`,[{label:'Cancel',action:closeModal},{label:'Create Rule',type:'primary',action:()=>{const type=$('#rule-type').value,name=$('#rule-name').value.trim()||'New Rule',lookback=$('#rule-lookback').value,frequency=$('#rule-frequency').value,scope=$('#rule-scope').value.trim()||'All campaigns';let engine=null,condition='',action='Review only',status='Draft';if(type==='Keyword Harvest'){engine={version:1,level:'searchterm',all:[{metric:'orders',op:'>=',value:+$('#rule-orders').value},{metric:'acosPct',op:'<=',value:+$('#rule-acos').value}]};condition=ruleConditionText(engine);action='Stage Add Exact Keyword';status='Enabled';}else if(type==='Negative Targeting'){engine={version:1,level:'searchterm',all:[{metric:'orders',op:'<=',value:0},{metric:'clicks',op:'>=',value:+$('#rule-clicks').value},{metric:'spend',op:'>=',value:+$('#rule-spend').value}]};condition=ruleConditionText(engine);action='Stage Negative Exact';status='Enabled';}const r={id:'r'+Date.now(),type,name,status,automation:false,lookback,frequency,condition,action,scope,engine};state.rules.push(r);save(STORAGE.rules,state.rules);closeModal();toast(status==='Enabled'?'Structured rule created and enabled':'Rule saved as Draft; execution model not implemented for this type',status==='Enabled'?'success':'warn');render();}}]);}
          '''
          text = replace_until(text, 'function openCreateRule()', 'function openRuleDetail(r)', create_rule)

          run_rules = r'''function runRules(){const enabled=state.rules.filter(r=>r.status==='Enabled'&&ruleExecutable(r));const skipped=state.rules.filter(r=>r.status==='Enabled'&&!ruleExecutable(r)).length;let added=0,matched=0;for(const r of enabled){const engine=ruleEngine(r);const candidates=aggregateLevel(getRangeRows(),engine.level||'searchterm').filter(x=>ruleMatches(x,engine));for(const t of candidates){matched++;if(added>=80)break;const duplicate=state.actions.some(a=>a.term===t.name&&a.status==='Pending'&&a.source===`Rule:${r.id}`);if(duplicate)continue;if(r.type==='Keyword Harvest'){queueAction('Add Exact Keyword',t.name,{reason:`Rule: ${r.name} · ${ruleConditionText(engine)}`,scope:r.scope||'Campaign review',source:`Rule:${r.id}`});added++;continue;}if(r.type==='Negative Targeting'){if(isProtected(t.name)||negativeConflict(t.name,getRangeRows()))continue;queueAction('Negative Exact',t.name,{reason:`Rule: ${r.name} · ${ruleConditionText(engine)}`,scope:r.scope||'Campaign scoped',source:`Rule:${r.id}`});added++;}}if(added>=80)break;}const detail=skipped?` · ${skipped} legacy/unsupported enabled rule(s) skipped`:'';toast(`${added} recommendations staged from ${enabled.length} structured rule(s) · ${matched} matches${detail}`,added?'success':'warn');renderNav();}
          '''
          text = replace_until(text, 'function runRules()', 'function queueAction(', run_rules)

          path.write_text(text, encoding='utf-8')
      - name: Validate JavaScript and rule contracts
        run: |
          node --check app.js
          grep -F "function ruleExecutable(r)" app.js
          grep -F "Create Structured Rule" app.js
          grep -F "legacy/unsupported enabled rule(s) skipped" app.js
          grep -F 'source:`Rule:${r.id}`' app.js
      - name: Remove one-shot workflows and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-rule-engine-fix.yml .github/workflows/repair-rule-engine-workflow.yml
          git add app.js
          git commit -m "Use structured rule criteria for recommendation runs"
          git push origin HEAD:fix/p1-structured-rule-engine
