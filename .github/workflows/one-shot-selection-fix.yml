name: One-shot selection state fix

on:
  push:
    branches:
      - fix/p1-selection-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-selection-state
          fetch-depth: 0
      - name: Patch exact render selection bug
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = 'function render(){renderNav();setMeta();state.selected.clear(); const fn='
          new = 'function render(){renderNav();setMeta(); const fn='
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one render selection pattern, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate selection semantics
        run: |
          node --check app.js
          grep -F "function render(){renderNav();setMeta(); const fn=" app.js
          grep -F "function resetTableState(clearDrill=true){state.search='';state.pageNo=1;state.selected.clear();" app.js
      - name: Remove one-shot workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-selection-fix.yml
          git add app.js
          git commit -m "Fix selection state across table rerenders"
          git push origin HEAD:fix/p1-selection-state
