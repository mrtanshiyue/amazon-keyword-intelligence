name: One-shot Global workspace functional completion

on:
  push:
    branches:
      - feature/p1-global-workspace-functional

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p1-global-workspace-functional
          fetch-depth: 0

      - name: Apply Global workspace patch
        run: python scripts/patch-global-workspace-functional.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Global contracts
        run: |
          npm run check
          grep -q "data-cross-view" app.js
          grep -q "global-keyword-status" app.js
          grep -q "global-keyword-sort" app.js
          grep -q "global-keyword-page-size" app.js
          grep -q "global-keyword-export" app.js
          grep -q "keywordos_v9_global_ui" app.js
          grep -q "Cross-store Intelligence" app.js
          ! grep -q "Efficiency · Coming next" app.js
          ! grep -q "Keywords · Coming next" app.js
          ! grep -q "Filter Library · Coming next" app.js
          ! grep -q "input.id === 'log-search' || input.id === 'kw-search' || input.id === 'global-keyword-search'" ui-actions.js

      - name: Build static assets
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Commit product patch and remove one-shot assets
        run: |
          rm scripts/patch-global-workspace-functional.py
          rm .github/workflows/one-shot-global-workspace-functional.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js ui-actions.js scripts/patch-global-workspace-functional.py .github/workflows/one-shot-global-workspace-functional.yml
          git commit -m "Complete Global workspace local interactions"
          git push origin HEAD:feature/p1-global-workspace-functional
