name: One-shot schedule draft persistence

on:
  push:
    branches:
      - fix/p1-schedule-draft-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-schedule-draft-persistence
          fetch-depth: 0

      - name: Persist local schedule drafts
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          old_storage = "  protected:'keywordos_v9_protected', rules:'keywordos_v9_rules', logs:'keywordos_v9_logs', settings:'keywordos_v9_settings', presets:'keywordos_v9_presets', presetDefault:'keywordos_v9_preset_default', suggestionReviews:'keywordos_v9_suggestion_reviews'\n"
          new_storage = "  protected:'keywordos_v9_protected', rules:'keywordos_v9_rules', logs:'keywordos_v9_logs', settings:'keywordos_v9_settings', presets:'keywordos_v9_presets', presetDefault:'keywordos_v9_preset_default', suggestionReviews:'keywordos_v9_suggestion_reviews', schedules:'keywordos_v9_schedules'\n"
          if text.count(old_storage) != 1:
              raise SystemExit('Storage insertion point not unique')
          text = text.replace(old_storage, new_storage, 1)

          old_state = "  suggestionReviews:load(STORAGE.suggestionReviews,{}),\n  protected:new Set(load(STORAGE.protected,DEFAULT_PROTECTED)), rules:load(STORAGE.rules,SEED.rules||[]),\n"
          new_state = "  suggestionReviews:load(STORAGE.suggestionReviews,{}),\n  schedules:load(STORAGE.schedules,[{id:'schedule-default',name:'Weekday efficiency window',campaigns:'Select later',days:'Mon–Fri',timeBlocks:'09:00–22:00',action:'Campaign state',status:'Draft',createdAt:'2026-06-30'}]),\n  protected:new Set(load(STORAGE.protected,DEFAULT_PROTECTED)), rules:load(STORAGE.rules,SEED.rules||[]),\n"
          if text.count(old_state) != 1:
              raise SystemExit('State insertion point not unique')
          text = text.replace(old_state, new_state, 1)

          new_schedule = r'''function renderSchedules(){
            const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],hours=[0,3,6,9,12,15,18,21];
            const grid=days.map((d,di)=>`<div class="schedule-row"><b>${d}</b>${hours.map((h,hi)=>`<button class="hour-cell level-${(di+hi)%5}" title="${d} ${String(h).padStart(2,'0')}:00 · Hourly API data not connected"><span>${String(h).padStart(2,'0')}</span></button>`).join('')}</div>`).join('');
            const scheduleRows=state.schedules.map(s=>`<tr><td class="left"><b>${esc(s.name)}</b><span class="subline">Saved ${esc(s.createdAt||'locally')}</span></td><td class="left">${esc(s.campaigns||'Select later')}</td><td>${esc(s.days)}</td><td>${esc(s.timeBlocks)}</td><td>${esc(s.action)}</td><td>${badge('Local Draft','gray')}</td><td class="center"><button class="btn danger sm" data-schedule-delete="${esc(s.id)}">Delete</button></td></tr>`).join('');
            $('#content').innerHTML=`<div class="h10-callout neutral"><div><b>Hourly analytics requires API-connected hourly data</b><span>Schedule drafts are saved locally. No Amazon campaign state or budget is changed in the current runtime.</span></div><button class="btn primary" id="create-schedule">＋ Create Schedule Draft</button></div>
            <div class="schedule-filterbar"><div class="field-inline"><label>Campaign</label><select class="select" disabled><option>Hourly campaign data not connected</option></select></div><div class="field-inline"><label>Period</label><select class="select" disabled><option>Last 30 days</option></select></div><div class="field-inline"><label>Days included</label><select class="select" disabled><option>All days</option></select></div><div class="field-inline"><label>Metric 1</label><select class="select" disabled><option>Spend</option></select></div><div class="field-inline"><label>Metric 2</label><select class="select" disabled><option>Sales</option></select></div></div>
            <div class="card"><div class="card-head"><div class="card-title"><h3>Hourly Campaign Performance</h3><small>Visualization preview only · no hourly API data connected</small></div><div class="heat-legend"><span>Low</span><i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i><span>High</span></div></div><div class="card-body"><div class="schedule-axis"><span></span>${hours.map(h=>`<span>${String(h).padStart(2,'0')}:00</span>`).join('')}</div><div class="schedule-grid">${grid}</div></div></div>
            <div class="card top-gap"><div class="card-head"><div class="card-title"><h3>Schedule Drafts</h3><small>${state.schedules.length} local draft(s) · no Amazon execution</small></div></div><div class="table-scroll"><table class="data-table"><thead><tr><th class="left">Schedule Name</th><th class="left">Campaign Scope</th><th>Days</th><th>Time blocks</th><th>Planned Action</th><th>Status</th><th class="center">Manage</th></tr></thead><tbody>${scheduleRows||`<tr><td colspan="7"><div class="empty-state"><h3>No schedule drafts</h3><p>Create a local draft to prepare a future API-connected schedule.</p></div></td></tr>`}</tbody></table></div></div>`;
            $('#create-schedule')?.addEventListener('click',()=>openModal('Create Schedule Draft',`<div class="form-grid"><label class="field"><span>Schedule Name</span><input id="schedule-name" class="input" value="Weekday efficiency window"></label><label class="field"><span>Campaign Scope</span><input id="schedule-campaigns" class="input" value="Select later" placeholder="Campaign name or scope"></label><label class="field"><span>Days Applied</span><select id="schedule-days" class="select"><option value="Mon–Fri">Monday–Friday</option><option value="Mon–Sun">Every day</option><option value="Sat–Sun">Weekend</option></select></label><label class="field"><span>Planned Action</span><select id="schedule-action" class="select"><option value="Campaign state">Enable / Pause campaigns</option><option value="Budget adjustment">Budget adjustment</option></select></label><label class="field"><span>Start Time</span><input id="schedule-start" class="input" type="time" value="09:00"></label><label class="field"><span>End Time</span><input id="schedule-end" class="input" type="time" value="22:00"></label></div><div class="notice-banner top-gap">Local draft only. Saving this form never calls Amazon Ads and never changes campaign state or budget.</div>`,[{label:'Cancel',action:closeModal},{label:'Save Local Draft',type:'primary',action:()=>{const name=$('#schedule-name')?.value.trim();if(!name)return toast('Enter a schedule name','warn');const start=$('#schedule-start')?.value||'09:00',end=$('#schedule-end')?.value||'22:00';const draft={id:'schedule-'+Date.now(),name,campaigns:$('#schedule-campaigns')?.value.trim()||'Select later',days:$('#schedule-days')?.value||'Mon–Fri',timeBlocks:`${start}–${end}`,action:$('#schedule-action')?.value||'Campaign state',status:'Draft',createdAt:new Date().toLocaleString()};state.schedules.unshift(draft);save(STORAGE.schedules,state.schedules);logEvent('Schedule Draft',draft.name,`Saved ${draft.days} ${draft.timeBlocks} · ${draft.action}`,'Manual','Schedules');closeModal();toast('Schedule draft saved locally','success');render();}}]));
            $$('[data-schedule-delete]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.scheduleDelete,draft=state.schedules.find(s=>s.id===id);if(!draft)return;state.schedules=state.schedules.filter(s=>s.id!==id);save(STORAGE.schedules,state.schedules);logEvent('Schedule Draft',draft.name,'Deleted local draft','Manual','Schedules');toast('Schedule draft deleted','success');render();}));
          }
          '''

          pattern = r'function renderSchedules\(\)\{.*?(?=\nfunction renderPortfolioOverview\(\))'
          text, count = re.subn(pattern, new_schedule.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one renderSchedules block, found {count}')

          path.write_text(text, encoding='utf-8')

      - name: Validate schedule persistence contracts
        run: |
          node --check app.js
          grep -F "schedules:'keywordos_v9_schedules'" app.js
          grep -F "Create Schedule Draft" app.js
          grep -F "Save Local Draft" app.js
          grep -F "data-schedule-delete" app.js
          grep -F "no Amazon execution" app.js

      - name: Remove one-shot workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-schedule-persistence.yml
          git add app.js
          git commit -m "Persist local schedule drafts"
          git push origin HEAD:fix/p1-schedule-draft-persistence
