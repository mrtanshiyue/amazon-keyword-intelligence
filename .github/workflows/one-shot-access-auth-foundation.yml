name: One-shot Access auth foundation

on:
  push:
    branches:
      - security/p1-access-auth-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/p1-access-auth-foundation
          fetch-depth: 0

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static validation
        run: |
          npm run check
          grep -q "Cf-Access-Jwt-Assertion\|cf-access-jwt-assertion" src/access-auth.js
          grep -q "algorithms: \['RS256'\]" src/access-auth.js
          grep -q "access_not_configured" src/access-auth.js
          grep -q "'/api/private/session'" src/worker.js
          grep -q "request.method !== 'GET' && request.method !== 'HEAD'" src/worker.js
          grep -q "CREATE TABLE IF NOT EXISTS access_users" migrations/0002_access_memberships.sql
          grep -q "CREATE TABLE IF NOT EXISTS store_memberships" migrations/0002_access_memberships.sql

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Commit lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-access-auth-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-shot-access-auth-foundation.yml
          git commit -m "Validate Access auth foundation and lock dependencies"
          git push origin HEAD:security/p1-access-auth-foundation
