name: One-shot local workspace scope patch

on:
  push:
    branches:
      - fix/local-workspace-scope-truth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-workspace-scope-truth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch and check
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ui-actions.js')
          s = p.read_text()
          old = """  function openLocalStoreWorkspace(id) {
    const store = storeById(id);
    if (!store) return;
    localOpenStoreId = id;
    if (store.id === 'store-a') {
      const select = $('#profile-select');
      if (select) {
        select.value = 'store-a';
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }
      return;
    }
    renderEmptyStoreWorkspace(store);
  }"""
          new = """  function openLocalStoreWorkspace(id) {
    const store = storeById(id);
    if (!store) return;
    localOpenStoreId = id;
    const select = $('#profile-select');
    if (store.builtIn && select) {
      select.value = store.id;
      select.dispatchEvent(new Event('change', { bubbles: true }));
      return;
    }
    if (select) {
      [...select.options]
        .filter((option) => option.dataset.localWorkspace === '1')
        .forEach((option) => option.remove());
      const option = document.createElement('option');
      option.value = store.id;
      option.textContent = store.name + ' · ' + store.marketplace + ' · Local · No data';
      option.dataset.localWorkspace = '1';
      option.disabled = true;
      option.selected = true;
      select.appendChild(option);
      select.value = store.id;
    }
    renderEmptyStoreWorkspace(store);
  }"""
          if s.count(old) != 1:
              raise SystemExit('openLocalStoreWorkspace exact match count: ' + str(s.count(old)))
          p.write_text(s.replace(old, new, 1))
          PY
          node --check ui-actions.js
          npm run check
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/one-shot-local-workspace-scope.yml
          git config user.name "mrtanshiyue"
          git config user.email "54257052+mrtanshiyue@users.noreply.github.com"
          git add ui-actions.js .github/workflows/one-shot-local-workspace-scope.yml
          git commit -m "Keep local Store workspace scope display truthful"
          git push origin HEAD:fix/local-workspace-scope-truth
