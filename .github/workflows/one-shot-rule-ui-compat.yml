name: One-shot rule UI compatibility fix

on:
  push:
    branches:
      - fix/p1-structured-rule-engine

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-structured-rule-engine
          fetch-depth: 0
      - name: Stop legacy UI override when structured rules are active
        shell: python
        run: |
          from pathlib import Path
          path = Path('ui-actions.js')
          text = path.read_text(encoding='utf-8')
          old = "  function markRuleTruth() {\n    if (pageTitle() !== 'Rules & Automation') return;\n\n    const run = $('#run-rules');\n"
          new = "  function markRuleTruth() {\n    if (pageTitle() !== 'Rules & Automation') return;\n\n    const run = $('#run-rules');\n    if (run?.textContent.includes('Run Executable Rules')) return;\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one markRuleTruth header, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate compatibility layer
        run: |
          node --check ui-actions.js
          grep -F "Run Executable Rules" ui-actions.js
      - name: Remove one-shot workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-rule-ui-compat.yml
          git add ui-actions.js
          git commit -m "Respect structured rule engine in UI capability layer"
          git push origin HEAD:fix/p1-structured-rule-engine
