name: One-shot sidebar nav fix

on:
  push:
    branches:
      - fix/sidebar-nav-after-partial-rerender

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sidebar-nav-after-partial-rerender
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact root-cause patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "  $$('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));"
          new = """  const sidebarNav = $('#sidebar-nav');
          if(sidebarNav&&!sidebarNav.dataset.pageNavBound){
            sidebarNav.dataset.pageNavBound='1';
            sidebarNav.addEventListener('click',event=>{
              const button=event.target instanceof Element?event.target.closest('[data-page]'):null;
              if(button&&sidebarNav.contains(button))go(button.dataset.page);
            });
          }"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 nav binding, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check app.js
          npm run check
      - name: Commit product fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-sidebar-nav-fix.yml
          git config user.name "mrtanshiyue"
          git config user.email "54257052+mrtanshiyue@users.noreply.github.com"
          git add app.js .github/workflows/one-shot-sidebar-nav-fix.yml
          git commit -m "Keep sidebar navigation bound across partial nav renders"
          git push origin HEAD:fix/sidebar-nav-after-partial-rerender
