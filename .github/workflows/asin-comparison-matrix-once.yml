name: ASIN Comparison Matrix Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/asin-comparison-matrix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded ASIN comparison patch
        run: python .github/scripts/asin-comparison-matrix-once.py
      - name: Focused ASIN comparison tests
        run: node --test tests/asin-comparison-matrix.test.mjs tests/growth-workspaces.test.mjs
      - name: Full check and build
        run: |
          npm run check
          npm run build
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md growth-workspaces.js growth-workspaces.css local-operations-actions.js tests/asin-comparison-matrix.test.mjs dist
          git diff --cached --check
          git commit -m "feat: add primary ASIN comparison matrix"
          git push origin HEAD:main
