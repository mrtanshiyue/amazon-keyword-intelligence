name: Listing Keyword Bank Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/listing-keyword-bank-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded Listing Keyword Bank patch
        run: python .github/scripts/listing-keyword-bank-once.py
      - name: Preserve Listing safety copy contract
        run: python .github/scripts/listing-keyword-bank-fix-once.py
      - name: Focused Listing Keyword Bank tests
        run: node --test tests/listing-keyword-bank.test.mjs tests/keyword-lab-bulk-actions.test.mjs tests/keyword-library-state.test.mjs tests/growth-workspaces.test.mjs
      - name: Full check
        run: |
          set -o pipefail
          npm run check | tee /tmp/check.log
          TEST_COUNT=$(grep -E '^# tests [0-9]+$' /tmp/check.log | tail -1 | awk '{print $3}')
          test -n "$TEST_COUNT"
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"
      - name: Build static assets
        run: |
          set -o pipefail
          npm run build | tee /tmp/build.log
          JS_COUNT=$(grep -E 'Static asset closure OK \([0-9]+ script modules \+ [0-9]+ stylesheets referenced\)\.' /tmp/build.log | tail -1 | sed -E 's/.*\(([0-9]+) script modules.*/\1/')
          PUBLISH_COUNT=$(grep -E 'Source/dist byte identity OK \([0-9]+ publish files\)\.' /tmp/build.log | tail -1 | sed -E 's/.*\(([0-9]+) publish files\).*/\1/')
          test -n "$JS_COUNT"
          test -n "$PUBLISH_COUNT"
          echo "JS_COUNT=$JS_COUNT" >> "$GITHUB_ENV"
          echo "PUBLISH_COUNT=$PUBLISH_COUNT" >> "$GITHUB_ENV"
      - name: Finalize README verification counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md')
          text=p.read_text()
          for old,new in {
            '__TEST_COUNT__':os.environ['TEST_COUNT'],
            '__JS_COUNT__':os.environ['JS_COUNT'],
            '__PUBLISH_COUNT__':os.environ['PUBLISH_COUNT'],
          }.items():
            if text.count(old)!=1:
              raise SystemExit(f'{old}: expected one placeholder, found {text.count(old)}')
            text=text.replace(old,new,1)
          p.write_text(text)
          PY
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app.js growth-workspaces.js tests/listing-keyword-bank.test.mjs dist
          git diff --cached --check
          git commit -m "feat: link keyword library to listing bank"
          git push origin HEAD:main
