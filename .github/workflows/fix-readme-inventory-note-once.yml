name: Normalize Inventory Hotfix README Once

on:
  push:
    paths:
      - '.github/workflows/fix-readme-inventory-note-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Normalize README hotfix history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text()
          sidebar='> 2026-09-03 阻断级 UI 回归修复：左侧导航此前同时被 `growth-workspaces.js` 和 `navigation-taxonomy.js` 的 MutationObserver 改写。Growth section 被 canonical organizer 移走后会被再次注入，导致 Product Master / Product 360 / Competitors / Reviews 等按钮无限重复，翻译/重排又持续触发 observer，最终造成点击页面卡死。现在 sidebar 改为显式单次同步：`app.js` 每次导航重绘后只执行一次 Growth 缺项补齐和 canonical organize；两个 sidebar MutationObserver 已移除，Growth 补齐按 page id 幂等，organizer 对 canonical page id 再做去重保护。回归测试明确禁止重新引入该 observer feedback loop。'
          stale='CI 为 **426 passed / 0 failed**；`npm run build` 验证 **49 个 JS + 9 个 CSS，59 个发布文件**，source/dist byte identity 与 committed-dist parity gate 继续生效。'
          inventory='> 2026-09-03 Inventory / Anomaly 阻断级卡死修复：'
          if text.count(sidebar)!=1 or text.count(stale)!=1 or text.count(inventory)!=1:
              raise SystemExit('README hotfix history shape changed')
          text=text.replace(sidebar, sidebar+' '+stale, 1)
          # Remove the stale sidebar CI suffix from the end of the later inventory paragraph.
          later=text.index(inventory)
          pos=text.index(stale,later)
          text=text[:pos]+text[pos+len(stale):]
          p.write_text(text)
          PY
          git diff --check
      - name: Commit README cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: separate inventory hotfix validation history"
          git push origin HEAD:main
