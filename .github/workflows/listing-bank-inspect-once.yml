name: Listing Bank Inspect Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/listing-bank-inspect-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print keyword library listing handler details
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text()
          for anchor in ["id=\"kw-trash-selected\"", "$('#kw-trash-selected')", "$('#kw-restore-selected')", 'function keywordLibraryColumnCatalog', 'function keywordLibraryCell', 'KeywordOSUIBridge =', 'KeywordOSUIBridge=']:
              pos=text.find(anchor)
              print(f'\n===== {anchor} @ {pos} =====')
              if pos>=0: print(text[max(0,pos-1800):min(len(text),pos+5200)])
          g=Path('growth-workspaces.js').read_text()
          for anchor in ['function stageListingKeywords', 'function save(k,v', 'function bind(rootNode)']:
              pos=g.find(anchor)
              print(f'\n===== growth {anchor} @ {pos} =====')
              if pos>=0: print(g[max(0,pos-1200):min(len(g),pos+4200)])
          PY
