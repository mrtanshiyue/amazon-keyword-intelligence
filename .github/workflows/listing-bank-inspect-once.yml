name: Listing Bank Inspect Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/listing-bank-inspect-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print listing keyword bank call paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def around(path, anchors, radius=1800):
              text=Path(path).read_text()
              print(f'\n######## {path} ########')
              for anchor in anchors:
                  pos=text.find(anchor)
                  print(f'\n===== {anchor} @ {pos} =====')
                  if pos < 0:
                      continue
                  start=max(0,pos-radius//3)
                  end=min(len(text),pos+radius)
                  print(text[start:end])

          around('growth-workspaces.js', [
              'function mergeListingKeywordBank',
              'keywordBank',
              "'listing-optimizer'",
              'Listing Keyword Bank',
              'data-listing',
              'listingPlacement'
          ], 4200)
          around('app.js', [
              'persistedKeywordAssetRows',
              'stageKeywordAssets',
              'Send to Listing',
              'mergeListingKeywordBank',
              'listing.keywordBank',
              'keywordLibraryState'
          ], 3200)
          around('keyword-library-state.js', [
              'function normalizeAsset',
              'favorite',
              'deletedAt',
              'customFields'
          ], 2200)
          around('tests/keyword-lab-bulk-actions.test.mjs', ['mergeListingKeywordBank'], 1800)
          around('tests/growth-workspaces.test.mjs', ['listing'], 1800)
          around('tests/growth-consistency-actions.test.mjs', ['listingPlacementSuggestions'], 2400)
          PY
