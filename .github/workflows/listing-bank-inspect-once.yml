name: Listing Bank Inspect Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/listing-bank-inspect-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print listing keyword bank integration details
        run: |
          python - <<'PY'
          from pathlib import Path

          def around(path, anchors, radius=2400):
              text=Path(path).read_text()
              print(f'\n######## {path} ########')
              for anchor in anchors:
                  pos=text.find(anchor)
                  print(f'\n===== {anchor} @ {pos} =====')
                  if pos < 0:
                      continue
                  start=max(0,pos-radius//3)
                  end=min(len(text),pos+radius)
                  print(text[start:end])

          around('growth-workspaces.js', [
              'function phraseCoverage',
              'function listingCoverage',
              'function normalizeListingKeywordBank',
              'function renderListing',
              "'[data-growth-listing]'",
              'data-growth-listing=',
              'mergeListingKeywordBank,',
              'return {'
          ], 5200)
          around('app.js', [
              'function renderKeywordLibrary',
              'Keyword Library',
              'data-keyword-library',
              'data-kwlib',
              'persistKeywordAssetRows',
              'function renderKeywordWorkflow'
          ], 5200)
          around('keyword-library-state.js', [
              'return{',
              'return {'
          ], 3000)
          around('tests/keyword-library-state.test.mjs', ['runtime is wired', 'Recycle Bin'], 2200)
          around('tests/growth-workspaces.test.mjs', ['listing coverage', 'listing versions'], 2600)
          PY
