name: Disable Auth Test Mode Once

on:
  push:
    paths:
      - '.github/scripts/disable-auth-test-mode-once.py'
      - '.github/workflows/disable-auth-test-mode-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded repository patch
        run: python .github/scripts/disable-auth-test-mode-once.py
      - name: Focused auth-mode tests
        run: node --test tests/worker-auth-mode.test.mjs
      - name: Full check
        run: npm run check
      - name: Build static assets
        run: npm run build
      - name: Verify source tree
        run: git diff --check
      - name: Enable Cloudflare Access Everyone bypass for test project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          apps="$(mktemp)"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps" > "$apps"
          app_id="$(jq -r '[.result[] | select(.name == "amazon-keyword-intelligence production access")][0].id // empty' "$apps")"
          test -n "$app_id" || { echo 'ACCESS_APP=NOT_FOUND'; exit 20; }
          policies="$(mktemp)"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${app_id}/policies" > "$policies"
          existing_id="$(jq -r '[.result[] | select(.name == "Temporary public test bypass — owner requested")][0].id // empty' "$policies")"
          if [ -z "$existing_id" ]; then
            body='{"name":"Temporary public test bypass — owner requested","decision":"bypass","precedence":2,"include":[{"everyone":{}}],"exclude":[],"require":[]}'
            response="$(mktemp)"
            code="$(curl -sS -o "$response" -w '%{http_code}' -X POST "${auth[@]}" --data "$body" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${app_id}/policies")"
            success="$(jq -r '.success // false' "$response")"
            echo "ACCESS_BYPASS_CREATE_HTTP=${code}"
            echo "ACCESS_BYPASS_CREATE_SUCCESS=${success}"
            if [ "$success" != "true" ]; then
              jq -r '.errors[]? | "ACCESS_BYPASS_ERROR=\(.code):\(.message)"' "$response"
              exit 21
            fi
          else
            echo 'ACCESS_BYPASS_ALREADY_PRESENT=true'
          fi
          verify="$(mktemp)"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${app_id}/policies" > "$verify"
          jq -e '.result[] | select(.name == "Temporary public test bypass — owner requested" and .decision == "bypass" and (.include | any(has("everyone"))))' "$verify" >/dev/null
          echo 'ACCESS_BYPASS_VERIFIED=true'
          jq -r '.result[] | "POLICY=\(.precedence // "?")|\(.decision // "")|\(.name // "")"' "$verify"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CURRENT_HANDOFF.md CLOUDFLARE_ARCHITECTURE.md P0_DATA_BOUNDARY.md src/worker.js tests/worker-auth-mode.test.mjs
          git diff --cached --check
          git commit -m "chore: disable authentication for test mode"
          git push origin HEAD:main
