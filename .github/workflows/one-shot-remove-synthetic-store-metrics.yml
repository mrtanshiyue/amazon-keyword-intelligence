name: One-shot remove synthetic store metrics

on:
  push:
    branches:
      - fix/p0-remove-synthetic-store-metrics

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-remove-synthetic-store-metrics
          fetch-depth: 0

      - name: Apply exact product-truth patch
        run: python scripts/patch-remove-synthetic-store-metrics.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate product truth and syntax
        run: |
          npm run check
          ! grep -q "store.id==='store-b'?0.62:0.47" app.js
          ! grep -q "storeB:b,storeC:c" app.js
          ! grep -q "STORE 03 · DEMO" app.js
          grep -q "cross-store evidence unavailable" app.js
          grep -q "— · no data" app.js
          grep -q "aggregateLevel(state.currentRows||\[\],'searchterm')" app.js

      - name: Build static assets
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Commit product patch and remove one-shot assets
        run: |
          rm scripts/patch-remove-synthetic-store-metrics.py
          rm .github/workflows/one-shot-remove-synthetic-store-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/patch-remove-synthetic-store-metrics.py .github/workflows/one-shot-remove-synthetic-store-metrics.yml
          git commit -m "Remove synthetic Store 02 and Store 03 metrics"
          git push origin HEAD:fix/p0-remove-synthetic-store-metrics
