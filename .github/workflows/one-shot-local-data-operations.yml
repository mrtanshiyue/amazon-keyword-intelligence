name: One-shot Local Data Operations completion

on:
  push:
    branches:
      - feature/p1-local-data-operations

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p1-local-data-operations
          fetch-depth: 0

      - name: Apply local data operations patch
        run: python scripts/patch-local-data-operations.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate local data operations contracts
        run: |
          npm run check
          grep -q "keywordos_v9_data_ops" app.js
          grep -q "function runLocalDataHealthCheck" app.js
          grep -q "refresh-local-data-status" app.js
          grep -q "Local Data Operations" app.js
          grep -q "It does not call Amazon" app.js
          grep -q "Amazon Live Sync" app.js
          ! grep -q "Sync Model Preview" app.js
          ! grep -q "Refresh Status · Preview" app.js
          ! grep -q "Planned 02:" app.js
          ! grep -q "Planned 03:" app.js
          ! grep -q "Planned 04:" app.js

      - name: Enforce deferred-auth boundary
        run: git diff --exit-code origin/main -- src/worker.js src/access-auth.js src/store-authorization.js migrations

      - name: Build static assets
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Commit product patch and remove one-shot assets
        run: |
          rm scripts/patch-local-data-operations.py
          rm .github/workflows/one-shot-local-data-operations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/patch-local-data-operations.py .github/workflows/one-shot-local-data-operations.yml
          git commit -m "Make Sync Center a real local data operations workspace"
          git push origin HEAD:feature/p1-local-data-operations
