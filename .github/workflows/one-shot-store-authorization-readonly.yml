name: One-shot store authorization readonly

on:
  push:
    branches:
      - security/p1-store-authorization-readonly

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/p1-store-authorization-readonly
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static checks
        run: npm run check

      - name: Store authorization contract tests
        run: node scripts/one-shot-store-authorization-test.mjs

      - name: Safety contracts
        run: |
          grep -q "schema_not_applied" src/store-authorization.js
          grep -q "store_access_denied" src/store-authorization.js
          grep -q "store_role_denied" src/store-authorization.js
          grep -q "readStoreMemberships" src/worker.js
          grep -q "request.method !== 'GET' && request.method !== 'HEAD'" src/worker.js

      - name: Build static assets
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Remove one-shot assets and commit
        run: |
          rm .github/workflows/one-shot-store-authorization-readonly.yml
          rm scripts/one-shot-store-authorization-test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-store-authorization-readonly.yml scripts/one-shot-store-authorization-test.mjs
          git commit -m "Validate read-only store authorization gate"
          git push origin HEAD:security/p1-store-authorization-readonly
