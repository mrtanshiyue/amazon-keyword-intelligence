name: Fix Sidebar Freeze Once

on:
  push:
    paths:
      - '.github/scripts/fix-sidebar-freeze-once.py'
      - '.github/workflows/fix-sidebar-freeze-once.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded sidebar patch
        run: python .github/scripts/fix-sidebar-freeze-once.py
      - name: Focused navigation tests
        run: node --test tests/navigation-taxonomy.test.mjs tests/productivity-actions.test.mjs tests/workflow-canonicalization.test.mjs
      - name: Full check
        run: npm run check | tee /tmp/check.log
      - name: Build static assets
        run: npm run build | tee /tmp/build.log
      - name: Update README after validation
        shell: bash
        run: |
          set -euo pipefail
          tests="$(grep -E '^# tests [0-9]+$' /tmp/check.log | tail -1 | awk '{print $3}')"
          js="$(grep -Eo 'Static asset closure OK \([0-9]+ script modules' /tmp/build.log | tail -1 | grep -Eo '[0-9]+')"
          publish="$(grep -Eo 'Source/dist byte identity OK \([0-9]+ publish files' /tmp/build.log | tail -1 | grep -Eo '[0-9]+')"
          test -n "$tests" && test -n "$js" && test -n "$publish"
          python - "$tests" "$js" "$publish" <<'PY'
          from pathlib import Path
          import sys
          tests, js, publish = sys.argv[1:]
          p = Path('README.md')
          text = p.read_text()
          anchor = "页面身份、canonical route alias、suite membership、sidebar group/order、command palette、page shell title/subtitle/breadcrumb 与 page-level i18n key 已集中到 `navigation-taxonomy.js` 的 Page Registry。legacy `tracker` / `listing-workspace` 只保留历史 route 兼容：导航组织器直接隐藏 legacy 按钮，旧 Listing helper 不再注入侧栏或拦截 Listing 套件。`product-language.js` 继续按 registry page/suite id 处理中英/双语的页面标题、侧栏、套件和 breadcrumb；这已经消除已知路由/标题漂移，但不等于所有动态 modal、空态和 aria 文案都已完成全量审计。"
          note = f"\n\n> 2026-09-03 阻断级 UI 回归修复：左侧导航此前同时被 `growth-workspaces.js` 和 `navigation-taxonomy.js` 的 MutationObserver 改写。Growth section 被 canonical organizer 移走后会被再次注入，导致 Product Master / Product 360 / Competitors / Reviews 等按钮无限重复，翻译/重排又持续触发 observer，最终造成点击页面卡死。现在 sidebar 改为显式单次同步：`app.js` 每次导航重绘后只执行一次 Growth 缺项补齐和 canonical organize；两个 sidebar MutationObserver 已移除，Growth 补齐按 page id 幂等，organizer 对 canonical page id 再做去重保护。回归测试明确禁止重新引入该 observer feedback loop。CI 为 **{tests} passed / 0 failed**；`npm run build` 验证 **{js} 个 JS + 9 个 CSS，{publish} 个发布文件**，source/dist byte identity 与 committed-dist parity gate 继续生效。"
          if note.strip() in text:
              raise SystemExit('README hotfix note already present')
          if anchor not in text:
              raise SystemExit('README anchor missing')
          p.write_text(text.replace(anchor, anchor + note, 1))
          PY
      - name: Verify source and committed dist
        run: |
          node scripts/check-dist-assets.mjs
          git diff --check
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js growth-workspaces.js navigation-taxonomy.js tests/navigation-taxonomy.test.mjs README.md dist/app.js dist/growth-workspaces.js dist/navigation-taxonomy.js
          git diff --cached --check
          git commit -m "fix: stop sidebar navigation feedback loop"
          git push origin HEAD:main
