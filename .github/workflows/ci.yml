name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: npm run check

      - name: Build static assets
        run: npm run build

      - name: Verify committed dist matches source build
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- dist)"
          if [ -n "$changes" ]; then
            echo "Committed dist does not match a clean npm run build:"
            printf '%s\n' "$changes"
            exit 1
          fi
