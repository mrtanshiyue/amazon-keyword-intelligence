name: One-shot import IndexedDB persistence

on:
  push:
    branches:
      - fix/p1-import-indexeddb-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-import-indexeddb-persistence
          fetch-depth: 0
      - name: Add durable browser import persistence
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          def replace_until(source, start, end, replacement, label):
              pattern = re.escape(start) + r'.*?(?=' + re.escape(end) + r')'
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one block, found {count}')
              return updated

          helpers = r'''const today = () => new Date().toISOString().slice(0,10);

const WORKSPACE_DB_NAME='keywordos_v9_workspace';
const WORKSPACE_DB_VERSION=1;
const WORKSPACE_DATASET_STORE='datasets';
function openWorkspaceDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(WORKSPACE_DB_NAME,WORKSPACE_DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(WORKSPACE_DATASET_STORE))db.createObjectStore(WORKSPACE_DATASET_STORE,{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Unable to open IndexedDB'));req.onblocked=()=>reject(new Error('IndexedDB upgrade blocked'));});}
async function workspaceDbGet(key){const db=await openWorkspaceDb();return new Promise((resolve,reject)=>{const tx=db.transaction(WORKSPACE_DATASET_STORE,'readonly'),req=tx.objectStore(WORKSPACE_DATASET_STORE).get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));tx.oncomplete=()=>db.close();tx.onabort=()=>{db.close();reject(tx.error||new Error('IndexedDB read aborted'));};});}
async function workspaceDbPut(record){const db=await openWorkspaceDb();return new Promise((resolve,reject)=>{const tx=db.transaction(WORKSPACE_DATASET_STORE,'readwrite');tx.objectStore(WORKSPACE_DATASET_STORE).put(record);tx.oncomplete=()=>{db.close();resolve(true);};tx.onerror=()=>{db.close();reject(tx.error||new Error('IndexedDB write failed'));};tx.onabort=()=>{db.close();reject(tx.error||new Error('IndexedDB write aborted'));};});}
async function workspaceDbDelete(key){const db=await openWorkspaceDb();return new Promise((resolve,reject)=>{const tx=db.transaction(WORKSPACE_DATASET_STORE,'readwrite');tx.objectStore(WORKSPACE_DATASET_STORE).delete(key);tx.oncomplete=()=>{db.close();resolve(true);};tx.onerror=()=>{db.close();reject(tx.error||new Error('IndexedDB delete failed'));};tx.onabort=()=>{db.close();reject(tx.error||new Error('IndexedDB delete aborted'));};});}
async function persistWorkspaceDataset(key,payload){try{await workspaceDbPut({key,schemaVersion:1,...payload});return true;}catch(err){console.warn('KeywordOS browser persistence unavailable',err);return false;}}
async function restorePersistentImports(){try{const [ads,finance]=await Promise.all([workspaceDbGet('ads'),workspaceDbGet('finance')]);if(ads?.schemaVersion===1&&Array.isArray(ads.rows)&&ads.rows.length){state.currentRows=clone(ads.rows);state.adsSource=ads.source||'Browser import';state.adsImportedAt=ads.importedAt||'';state.adsPersistent=true;}if(finance?.schemaVersion===1&&Array.isArray(finance.rows)&&finance.rows.length){state.financeRows=clone(finance.rows);state.financeSource=finance.source||'Browser import';state.financeImportedAt=finance.importedAt||'';state.financePersistent=true;}}catch(err){console.warn('KeywordOS persistent import restore skipped',err);}}
async function resetPersistentDataset(kind){try{await workspaceDbDelete(kind);}catch(err){console.warn('KeywordOS persistent dataset reset skipped',err);}if(kind==='ads'){state.currentRows=clone(SEED.rows||[]);state.adsSource='Cloudflare seed · 202606.csv';state.adsImportedAt='';state.adsPersistent=false;state.importPreview=null;state.range='30';$('#range-select').value='30';logEvent('Data Import Reset','Amazon Ads','Restored Cloudflare seed dataset','Manual','Import');toast('Amazon Ads workspace reset to Cloudflare seed','success');state.page='import';render();return;}state.financeRows=clone(FIN_SEED.rows||[]);state.financeSource=FIN_SEED.meta?.source||'Unified Report';state.financeImportedAt='';state.financePersistent=false;state.financePageNo=1;state.financeSearch='';logEvent('Unified Report Reset','Unified Transaction','Restored Cloudflare seed dataset','Manual','Import');toast('Unified Report reset to Cloudflare seed','success');render();}
'''
          text = replace_once(text, "const today = () => new Date().toISOString().slice(0,10);\n", helpers, 'IndexedDB helpers')

          old_state = "  currentRows: clone(SEED.rows||[]), importPreview:null, visibleColumns:{},\n  financeRows:clone(FIN_SEED.rows||[]), financeSource:(FIN_SEED.meta?.source||'Unified Report'), financeImportPreview:null, financePageNo:1, financePageSize:25, financeSearch:'', financeFilters:{type:'all',status:'all',product:'all'}"
          new_state = "  currentRows: clone(SEED.rows||[]), adsSource:'Cloudflare seed · 202606.csv', adsImportedAt:'', adsPersistent:false, importPreview:null, visibleColumns:{},\n  financeRows:clone(FIN_SEED.rows||[]), financeSource:(FIN_SEED.meta?.source||'Unified Report'), financeImportedAt:'', financePersistent:false, financeImportPreview:null, financePageNo:1, financePageSize:25, financeSearch:'', financeFilters:{type:'all',status:'all',product:'all'}"
          text = replace_once(text, old_state, new_state, 'state persistence metadata')

          current_workspace_old = '<div class="card"><div class="card-head"><div class="card-title"><h3>Current Workspace</h3></div></div><div class="card-body">'
          current_workspace_new = '<div class="card"><div class="card-head"><div class="card-title"><h3>Current Workspace</h3><small>${esc(state.adsSource)} · ${state.adsPersistent?\'Browser persisted\':\'Cloudflare seed\'}</small></div>${state.adsPersistent?`<button class="btn danger sm" id="reset-ads-import">Reset to Cloudflare Seed</button>`:\'\'}</div><div class="card-body">'
          text = replace_once(text, current_workspace_old, current_workspace_new, 'Ads import source status')

          bind_old = "$('#cancel-import')?.addEventListener('click',()=>{state.importPreview=null;render();});$('#commit-import')?.addEventListener('click',commitImport);}"
          bind_new = "$('#cancel-import')?.addEventListener('click',()=>{state.importPreview=null;render();});$('#reset-ads-import')?.addEventListener('click',()=>resetPersistentDataset('ads'));$('#commit-import')?.addEventListener('click',commitImport);}"
          text = replace_once(text, bind_old, bind_new, 'Ads reset binding')

          commit_import = r'''async function commitImport(){const p=state.importPreview;if(!p)return;const rows=p.rows.map(r=>({date:r.date,account:r.accountName,portfolio:r.portfolioName,campaign:r.campaignName,campaignId:r.campaignId,adGroup:r.adGroupName,target:r.target,searchTerm:r.searchTerm,matchType:r.matchType,targetClass:r.targetClass,status:r.targetStatus,product:r.productCode||'UNASSIGNED',bid:r.bid,impressions:r.impressions,clicks:r.clicks,spend:r.cost,orders:r.orders,sales:r.sales,units:r.units})),importedAt=new Date().toISOString();state.currentRows=rows;state.adsSource=p.fileName;state.adsImportedAt=importedAt;const persisted=await persistWorkspaceDataset('ads',{rows,source:p.fileName,importedAt,rowCount:rows.length});state.adsPersistent=persisted;logEvent('Data Import',p.fileName,`Imported ${fmtInt(p.summary.rows)} rows · ${p.resolved.recognized.length}/${p.resolved.headers.length} fields recognized${persisted?' · browser persisted':' · session only'}`,'KeywordOS','Import');state.importPreview=null;state.range='30';$('#range-select').value='30';toast(persisted?'Amazon Ads report imported and saved in this browser':'Amazon Ads report imported for this session; browser persistence is unavailable',persisted?'success':'warn');state.page='overview';render();}

'''
          text = replace_until(text, 'function commitImport()', 'function financeMaxDate()', commit_import, 'Ads commit persistence')

          finance_source_old = "<small>${esc(state.financeSource||'Imported report')} · ${fmtInt(rows.length)} transactions in selected range</small>"
          finance_source_new = "<small>${esc(state.financeSource||'Imported report')} · ${fmtInt(rows.length)} transactions in selected range · ${state.financePersistent?'Browser persisted':'Cloudflare seed/session'}</small>"
          text = replace_once(text, finance_source_old, finance_source_new, 'Unified source status')

          finance_toolbar_old = '<div class="toolbar-right"><button class="btn" id="finance-export-summary">⇩ Export Summary</button><button class="btn primary" id="finance-import">＋ Import Unified Report</button></div>'
          finance_toolbar_new = '<div class="toolbar-right">${state.financePersistent?`<button class="btn danger" id="finance-reset-local">Reset Local Import</button>`:\'\'}<button class="btn" id="finance-export-summary">⇩ Export Summary</button><button class="btn primary" id="finance-import">＋ Import Unified Report</button></div>'
          text = replace_once(text, finance_toolbar_old, finance_toolbar_new, 'Unified reset button')

          finance_bind_old = "  $('#finance-import')?.addEventListener('click',()=>$('#hidden-unified-file').click());\n"
          finance_bind_new = "  $('#finance-import')?.addEventListener('click',()=>$('#hidden-unified-file').click());\n  $('#finance-reset-local')?.addEventListener('click',()=>resetPersistentDataset('finance'));\n"
          text = replace_once(text, finance_bind_old, finance_bind_new, 'Unified reset binding')

          unified_handler = r'''$('#hidden-unified-file')?.addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const p=UnifiedReportAdapter.analyzeText(reader.result);state.financeImportPreview={...p,fileName:file.name};openModal('Unified Report Validation',`<div class="schema-stats"><div class="schema-stat"><span>Rows</span><b>${fmtInt(p.summary.rows)}</b></div><div class="schema-stat"><span>Fields</span><b>${p.headers.length}</b></div><div class="schema-stat"><span>Settlements</span><b>${fmtInt(p.summary.settlements)}</b></div><div class="schema-stat"><span>Operating Net</span><b>${fmtMoney(p.summary.operatingNet)}</b></div></div><div class="notice-banner top-gap"><b>${esc(file.name)}</b><br>${esc(p.summary.dateMin)} → ${esc(p.summary.dateMax)} · ${p.summary.types.map(esc).join(', ')}</div>`,[{label:'Cancel',action:closeModal},{label:'Import & Replace',type:'primary',action:async()=>{const rows=clone(p.rows),importedAt=new Date().toISOString();state.financeRows=rows;state.financeSource=file.name;state.financeImportedAt=importedAt;state.financePageNo=1;state.financeSearch='';const persisted=await persistWorkspaceDataset('finance',{rows,source:file.name,importedAt,rowCount:rows.length});state.financePersistent=persisted;state.logs.unshift({id:'fin-'+Date.now(),date:new Date().toLocaleString(),source:'Import',type:'Unified Report Import',target:file.name,campaign:'—',change:`Loaded ${p.rows.length} unified transaction rows${persisted?' · browser persisted':' · session only'}`,by:'KeywordOS'});save(STORAGE.logs,state.logs);closeModal();toast(persisted?'Unified Transaction Report imported and saved in this browser':'Unified Transaction Report imported for this session; browser persistence is unavailable',persisted?'success':'warn');render()}}])}catch(err){toast(err.message||'Unable to parse Unified Report','error')}};reader.readAsText(file,'utf-8');e.target.value='';});


'''
          text = replace_until(text, "$('#hidden-unified-file')?.addEventListener", 'function renderSettings()', unified_handler, 'Unified import persistence')

          ads_health_old = '<p><b>Amazon Ads</b><span>202606.csv</span><em>45 / 45 recognized</em></p><p><b>Unified Transaction</b><span>June 2026</span><em>Loaded</em></p>'
          ads_health_new = '<p><b>Amazon Ads</b><span>${esc(state.adsSource)}</span><em>${state.adsPersistent?\'Browser persisted\':\'Cloudflare seed/session\'}</em></p><p><b>Unified Transaction</b><span>${esc(state.financeSource)}</span><em>${state.financePersistent?\'Browser persisted\':\'Cloudflare seed/session\'}</em></p>'
          text = replace_once(text, ads_health_old, ads_health_new, 'Data Health source truth')

          startup_old = "render();\n})();"
          startup_new = "restorePersistentImports().finally(()=>render());\n})();"
          text = replace_once(text, startup_old, startup_new, 'startup restore')

          path.write_text(text, encoding='utf-8')
      - name: Validate persistence contract
        run: |
          node --check app.js
          grep -F "indexedDB.open(WORKSPACE_DB_NAME" app.js
          grep -F "persistWorkspaceDataset('ads'" app.js
          grep -F "persistWorkspaceDataset('finance'" app.js
          grep -F "restorePersistentImports().finally(()=>render())" app.js
          grep -F "Reset to Cloudflare Seed" app.js
          grep -F "finance-reset-local" app.js
          grep -F "Browser persisted" app.js
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-import-indexeddb-persistence.yml
          git add app.js
          git commit -m "Persist imported workspace data in IndexedDB"
          git push origin HEAD:fix/p1-import-indexeddb-persistence
