name: One-shot Suggestions convergence regression

on:
  push:
    branches:
      - fix/suggestions-state-convergence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repository syntax gate
        run: npm run check
      - name: Use preinstalled Chrome
        run: |
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
          npm install --no-save playwright@1.55.0
      - name: Verify ui-actions and suggestions-actions converge
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_BIN });
          const page = await browser.newPage();
          page.setDefaultTimeout(3000);
          await page.setContent(`
            <select id="profile-select"><option value="store-a" selected>Store 01</option></select>
            <h1 id="page-title">Suggestions</h1><p id="page-subtitle"></p><span id="breadcrumb"></span>
            <section id="content">
              <div class="h10-toolbar"><div class="searchbox"><input placeholder="Search suggestions"></div><button>Portfolio ⌄</button><button>Campaign ⌄</button><button>Status ⌄</button><button>⚙ Columns</button></div>
              <table class="h10-table"><thead><tr><th><input type="checkbox"></th></tr></thead><tbody><tr><td><input data-suggest-select type="checkbox"></td><td><button data-suggest-action="apply">Apply</button></td></tr></tbody></table>
              <button id="apply-suggestion-changes">Apply 0 Changes</button><button id="suggestion-settings">Settings</button>
            </section><div id="modal-root"></div><div id="drawer-root"></div>
          `);
          await page.addScriptTag({ path: 'ui-actions.js' });
          await page.addScriptTag({ path: 'suggestions-actions.js' });
          await page.waitForTimeout(250);
          let state = await page.evaluate(() => ({ text: document.querySelector('#apply-suggestion-changes').textContent, disabled: document.querySelector('#apply-suggestion-changes').disabled }));
          if (state.text !== 'Stage 0 Selected' || !state.disabled) throw new Error(`Initial convergence failed: ${JSON.stringify(state)}`);
          await page.evaluate(() => document.querySelector('#content').append(document.createElement('span')));
          await page.waitForTimeout(250);
          state = await page.evaluate(() => ({ text: document.querySelector('#apply-suggestion-changes').textContent, disabled: document.querySelector('#apply-suggestion-changes').disabled }));
          if (state.text !== 'Stage 0 Selected' || !state.disabled) throw new Error(`Post-mutation convergence failed: ${JSON.stringify(state)}`);
          await page.locator('input[data-suggest-select]').check();
          await page.waitForTimeout(150);
          state = await page.evaluate(() => ({ text: document.querySelector('#apply-suggestion-changes').textContent, disabled: document.querySelector('#apply-suggestion-changes').disabled }));
          if (state.text !== 'Stage 1 Selected' || state.disabled) throw new Error(`Selection convergence failed: ${JSON.stringify(state)}`);
          await browser.close();
          console.log('Suggestions cross-script convergence PASS');
          EOF
