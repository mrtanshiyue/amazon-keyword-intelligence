name: Probe Surge Gateway Worker Capability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-surge-gateway-worker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Worker read and write capability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          out="cloudflare-surge-probe-result.txt"
          : > "$out"

          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "${auth[@]}" "$api/surge-config-gateway" || true)"
          ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")"
          printf 'GET surge-config-gateway -> HTTP %s, content-type=%s\n' "$code" "${ctype:-unknown}" >> "$out"

          if [ "$code" = "200" ]; then
            python3 - "$body" "$out" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          text = p.read_text(encoding="utf-8", errors="replace")
          checks = {
              "has_publish_ios": "/publish/ios" in text,
              "has_ios_conf": "/ios.conf" in text,
              "has_blockads_route": "blockAds-fixed.sgmodule" in text,
              "mentions_kv": bool(re.search(r"\.put\(|\.get\(", text)),
          }
          with out.open("a", encoding="utf-8") as f:
              for k, v in checks.items():
                  f.write(f"{k}={str(v).lower()}\n")
          PY
          fi

          # Deliberately invalid JavaScript: permission can be tested without creating a valid Worker.
          probe_body="$(mktemp)"
          write_code="$(curl -sS -o "$probe_body" -w '%{http_code}' \
            -X PUT "${auth[@]}" \
            -H 'Content-Type: application/javascript' \
            --data-binary 'const = intentionally_invalid' \
            "$api/__surge_permission_probe_do_not_use__" || true)"
          printf 'PUT invalid probe worker -> HTTP %s\n' "$write_code" >> "$out"

          # Record only Cloudflare error codes/messages, never auth material or script source.
          python3 - "$probe_body" "$out" <<'PY'
          import json, pathlib, sys
          body = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          out = pathlib.Path(sys.argv[2])
          try:
              data = json.loads(body)
          except Exception:
              data = {}
          errors = data.get("errors") or []
          with out.open("a", encoding="utf-8") as f:
              for e in errors[:3]:
                  code = e.get("code", "")
                  msg = str(e.get("message", "")).replace("\n", " ")[:240]
                  f.write(f"cf_error={code}:{msg}\n")
          PY

          # Defensive cleanup in the impossible case invalid JS was accepted.
          if [ "$write_code" = "200" ] || [ "$write_code" = "201" ]; then
            curl -sS -X DELETE "${auth[@]}" "$api/__surge_permission_probe_do_not_use__" >/dev/null || true
          fi

      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-surge-probe-result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record Surge gateway Worker capability probe [skip ci]"
          git push
