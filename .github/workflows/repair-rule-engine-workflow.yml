name: Repair rule engine workflow

on:
  push:
    branches:
      - fix/p1-structured-rule-engine

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-structured-rule-engine
          fetch-depth: 0
      - name: Repair validation quoting and allow one bot-triggered execution
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/one-shot-rule-engine-fix.yml')
          text = path.read_text(encoding='utf-8')
          bad = '    if: github.actor != \'github-actions[bot]\'\n'
          if bad not in text:
              raise SystemExit('Expected bot guard not found')
          text = text.replace(bad, '', 1)
          old = '          grep -F "source:\\`Rule:${r.id}\\`" app.js\n'
          new = "          grep -F 'source:`Rule:${r.id}`' app.js\n"
          if old not in text:
              raise SystemExit('Expected failing grep not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit repaired one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-rule-engine-workflow.yml
          git add .github/workflows/one-shot-rule-engine-fix.yml
          git commit -m "Repair structured rule engine validation"
          git push origin HEAD:fix/p1-structured-rule-engine
