name: Third Party Proprietary Metrics Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/third-party-proprietary-metrics-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded proprietary metric evidence patch
        run: python .github/scripts/third-party-proprietary-metrics-once.py
      - name: Focused proprietary metric tests
        run: node --test tests/third-party-proprietary-metrics.test.mjs
      - name: Full check and build
        run: |
          npm run check
          npm run build
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md keyword-lab.js tests/third-party-proprietary-metrics.test.mjs dist
          git diff --cached --check
          git commit -m "feat: preserve third-party proprietary metric evidence"
          git push origin HEAD:main
