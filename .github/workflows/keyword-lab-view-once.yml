name: Keyword Lab View Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/keyword-lab-view-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded Keyword Lab view patch
        run: python .github/scripts/keyword-lab-view-once.py
      - name: Check and build
        run: |
          npm run check
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app.js keyword-lab.js keyword-lab-view.js workspace-organizer.js local-operations-actions.js ui-capability-guard.js index.html package.json tests/keyword-lab-view.test.mjs tests/workspace-organizer.test.mjs tests/ui-capability-guard.test.mjs dist
          git diff --cached --check
          git commit -m "feat: complete Keyword Lab view controls"
          git push origin HEAD:main
