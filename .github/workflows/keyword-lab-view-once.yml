name: Keyword Lab View Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/keyword-lab-view-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix default Keyword Lab columns
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('keyword-lab-view.js')
          text = path.read_text()
          old = "function normalizeColumns(mode,values){\n  const allowed=allowedKeys(mode),seen=new Set(),out=[];\n  for(const raw of Array.isArray(values)?values:[]){const key=clean(raw);if(!allowed.includes(key)||seen.has(key))continue;seen.add(key);out.push(key);}\n  if(!seen.has('keyword'))out.unshift('keyword');\n  return out.length?out:[...allowed];\n}"
          new = "function normalizeColumns(mode,values){\n  const allowed=allowedKeys(mode);\n  if(!Array.isArray(values))return[...allowed];\n  const seen=new Set(),out=[];\n  for(const raw of values){const key=clean(raw);if(!allowed.includes(key)||seen.has(key))continue;seen.add(key);out.push(key);}\n  if(!seen.has('keyword'))out.unshift('keyword');\n  return out.length?out:[...allowed];\n}"
          if text.count(old) != 1:
              raise SystemExit(f'normalizeColumns default: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/keyword-lab-view.test.mjs')
          test_text = test_path.read_text()
          anchor = "test('Keyword Lab column normalization keeps one stable keyword identity and drops unknown columns', () => {\n  assert.deepEqual(view.normalizeColumns('discovery',['sales','bogus','sales']),['keyword','sales']);"
          replacement = "test('Keyword Lab column normalization keeps one stable keyword identity and drops unknown columns', () => {\n  assert.deepEqual(view.normalizeColumns('discovery'),view.allowedKeys('discovery'));\n  assert.deepEqual(view.normalizeState({}).columns.batch,view.allowedKeys('batch'));\n  assert.deepEqual(view.normalizeColumns('discovery',['sales','bogus','sales']),['keyword','sales']);"
          if test_text.count(anchor) != 1:
              raise SystemExit(f'default column test: expected one match, found {test_text.count(anchor)}')
          test_path.write_text(test_text.replace(anchor, replacement, 1))
          PY
      - name: Check and build
        run: |
          npm run check
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keyword-lab-view.js tests/keyword-lab-view.test.mjs dist/keyword-lab-view.js
          git diff --cached --check
          git commit -m "fix: preserve default Keyword Lab columns"
          git push origin HEAD:main
