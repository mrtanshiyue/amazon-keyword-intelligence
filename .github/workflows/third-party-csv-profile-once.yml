name: Third Party CSV Profile Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/third-party-csv-profile-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recover and apply guarded patch
        shell: bash
        run: |
          git show HEAD^^^:.github/workflows/third-party-csv-profile-once.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/third-party-profile-patch.py
          test -s /tmp/third-party-profile-patch.py
          python /tmp/third-party-profile-patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('growth-import-validation.js')
          text=p.read_text()
          old="const exact=label.match(/^([A-Z0-9]{10})$/i);"
          new="const exact=label.match(/^(?=[A-Z0-9]{10}$)(?=.*\\d)([A-Z0-9]{10})$/i);"
          if text.count(old)!=1:
              raise SystemExit(f'wide ASIN matcher: expected one match, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Check and build
        run: |
          npm run check
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md growth-import-validation.js growth-import-gate.js growth-workspaces.js tests/growth-import-validation.test.mjs dist
          git diff --cached --check
          git commit -m "feat: add third-party keyword CSV profiles"
          git push origin HEAD:main
