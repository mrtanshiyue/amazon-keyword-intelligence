name: Third Party CSV Profile Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/third-party-csv-profile-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply provider CSV profile patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('growth-import-validation.js',
          "  'reverse-asin':{required:[['ASIN','Child ASIN','Product ASIN'],['Keyword','Search Term','Query']],numbers:[",
          "  'reverse-asin':{required:[['ASIN','Child ASIN','Product ASIN'],['Keyword','Search Term','Query']],dates:[['Snapshot Date','Data Date','Date']],numbers:[")

          replace_once('growth-import-validation.js',
          "  for(const [aliases,mode] of schema.numbers||[]){\n    if(!hasColumn(map,aliases))continue;\n    validateNumber(rawValue(row,map,aliases),mode,labelFor(aliases),reasons);\n  }\n  return{state:reasons.length?'rejected':'accepted',rowNumber,reasons};",
          "  for(const [aliases,mode] of schema.numbers||[]){\n    if(!hasColumn(map,aliases))continue;\n    validateNumber(rawValue(row,map,aliases),mode,labelFor(aliases),reasons);\n  }\n  if(kind==='reverse-asin'){\n    const asin=clean(rawValue(row,map,['ASIN','Child ASIN','Product ASIN']));\n    if(asin&&!/^[A-Z0-9]{10}$/i.test(asin))reasons.push('ASIN must be a 10-character alphanumeric identifier');\n  }\n  return{state:reasons.length?'rejected':'accepted',rowNumber,reasons};")

          validation_anchor = "return{MAX_IMPORT_BYTES,SUPPORTED_KINDS,SCHEMAS,parseCSV,strictDate,strictNumber,validateGrowthCsv};"
          validation_add = r'''const THIRD_PARTY_PROFILE_VERSION='keywordos-third-party-v1';
const PROFILE_FIXED_HEADERS=Object.freeze(['ASIN','Keyword','Search Volume','Organic Rank','Sponsored Rank','Traffic Share','Conversion Rate','Marketplace','Provider','Report Type','Report Version','Snapshot Date','Source File']);
const THIRD_PARTY_PROFILES=Object.freeze([
  Object.freeze({
    id:'helium10-cerebro',provider:'Helium 10',reportType:'Cerebro',kind:'reverse-asin',
    signals:Object.freeze(['Cerebro IQ Score','Title Density','Sponsored ASINs','Competing Products','CPR','Keyword Sales','ABA Total Click Rate']),
    fields:Object.freeze({
      asin:Object.freeze(['ASIN','Product ASIN','Child ASIN']),
      keyword:Object.freeze(['Keyword Phrase','Keyword','Search Term','Phrase']),
      volume:Object.freeze(['Search Volume']),
      organicRank:Object.freeze(['Organic Rank','Position (Rank)','Position Rank']),
      sponsoredRank:Object.freeze(['Sponsored Rank']),
      trafficShare:Object.freeze([]),conversionRate:Object.freeze([]),
      marketplace:Object.freeze(['Marketplace','Market','Amazon Marketplace','Site']),
      reportVersion:Object.freeze(['Report Version','Export Version']),
      snapshotDate:Object.freeze(['Snapshot Date','Data Date','Date','Last Detected'])
    })
  }),
  Object.freeze({
    id:'sellersprite-reverse-asin',provider:'SellerSprite',reportType:'Reverse ASIN',kind:'reverse-asin',
    signals:Object.freeze(['SPR','DSR','ABA Rank/W','Searches/M','M. Searches','PPC Bid','Click Concentration','Related ASINs']),
    fields:Object.freeze({
      asin:Object.freeze(['ASIN','Product ASIN','Child ASIN']),
      keyword:Object.freeze(['Keyword','Search Term','Search Query']),
      volume:Object.freeze(['Searches/M','M. Searches','Monthly Searches','Monthly Search Volume','Search Volume']),
      organicRank:Object.freeze(['Organic Rank','Organic Position']),
      sponsoredRank:Object.freeze(['Sponsored Rank','Sponsored Position','SP Rank']),
      trafficShare:Object.freeze(['Impression Share','Traffic Share','Click Share']),
      conversionRate:Object.freeze(['Conversion','Conversion Rate','CVR','Purchase Rate']),
      marketplace:Object.freeze(['Marketplace','Market','Amazon Marketplace','Site']),
      reportVersion:Object.freeze(['Report Version','Export Version']),
      snapshotDate:Object.freeze(['Snapshot Date','Data Date','Date','Last Detected'])
    })
  })
]);

function sourceHeader(headers,index){return index==null?'':clean(headers[index]);}
function profileFieldIndexes(headers,profile){
  const map=headerMap(headers),indexes={};
  for(const [field,aliases] of Object.entries(profile.fields))indexes[field]=columnIndex(map,aliases);
  return indexes;
}
function detectThirdPartyProfile(kind,headers){
  if(kind!=='reverse-asin')return null;
  const normalized=new Set(headers.map(normalizeHeader));
  let best=null,bestScore=0;
  for(const profile of THIRD_PARTY_PROFILES){
    if(profile.kind!==kind)continue;
    const map=headerMap(headers),keywordIndex=columnIndex(map,profile.fields.keyword);
    if(keywordIndex==null)continue;
    const score=profile.signals.reduce((sum,signal)=>sum+(normalized.has(normalizeHeader(signal))?1:0),0);
    if(score>bestScore){best=profile;bestScore=score;}
  }
  return bestScore>0?best:null;
}
function wideAsinMetric(header){
  const label=clean(header);
  const exact=label.match(/^([A-Z0-9]{10})$/i);
  if(exact)return{asin:exact[1].toUpperCase(),field:'organicRank'};
  const match=label.match(/^([A-Z0-9]{10})[\s_|:/-]+(organic rank|organic position|sponsored rank|sponsored position|sp rank|click share|traffic share|impression share|conversion|conversion rate|cvr)$/i);
  if(!match)return null;
  const metric=normalizeHeader(match[2]);
  const field=metric==='organic rank'||metric==='organic position'?'organicRank':metric==='sponsored rank'||metric==='sponsored position'||metric==='sp rank'?'sponsoredRank':metric==='click share'||metric==='traffic share'||metric==='impression share'?'trafficShare':'conversionRate';
  return{asin:match[1].toUpperCase(),field};
}
function consistentColumnValue(rows,index,normalizer=clean){
  if(index==null)return'';
  const values=[...new Set(rows.map(row=>normalizer(row[index]??'')).filter(Boolean))];
  return values.length===1?values[0]:'';
}
function profileThirdPartyCsv(kind,text,options={}){
  const rows=parseCSV(text);
  if(!rows.length)throw new Error('CSV is empty');
  const headerIndex=rows.findIndex(row=>row.some(value=>clean(value)));
  if(headerIndex<0)throw new Error('CSV is empty');
  const headers=rows[headerIndex],dataRows=rows.slice(headerIndex+1).filter(row=>row.some(value=>clean(value)));
  if(!dataRows.length)throw new Error('CSV contains no data rows');
  for(let index=0;index<dataRows.length;index+=1)if(dataRows[index].length!==headers.length)throw new Error(`Third-party CSV row ${headerIndex+index+2} has ${dataRows[index].length} columns; expected ${headers.length}`);
  const profile=detectThirdPartyProfile(kind,headers);
  if(!profile)return null;
  const indexes=profileFieldIndexes(headers,profile),usedIndexes=new Set(Object.values(indexes).filter(index=>index!=null));
  const wide=new Map();
  if(indexes.asin==null){
    headers.forEach((header,index)=>{const match=wideAsinMetric(header);if(!match)return;usedIndexes.add(index);const metrics=wide.get(match.asin)||{};metrics[match.field]=index;wide.set(match.asin,metrics);});
  }
  const unknownIndexes=[];
  headers.forEach((header,index)=>{if(clean(header)&&!usedIndexes.has(index))unknownIndexes.push(index);});
  const unknownHeaders=unknownIndexes.map(index=>clean(headers[index]));
  const fallbackAsin=clean(options.asin).toUpperCase(),fallbackMarketplace=clean(options.marketplace),fallbackSnapshot=clean(options.snapshotDate),fallbackVersion=clean(options.reportVersion),sourceFile=clean(options.sourceFile);
  if(fallbackAsin&&!/^[A-Z0-9]{10}$/i.test(fallbackAsin))throw new Error('Fallback ASIN must be a 10-character alphanumeric identifier');
  if(fallbackSnapshot&&!strictDate(fallbackSnapshot))throw new Error('Snapshot date must use a valid YYYY-MM-DD date');
  const detectedAsin=consistentColumnValue(dataRows,indexes.asin,value=>clean(value).toUpperCase());
  const detectedMarketplace=consistentColumnValue(dataRows,indexes.marketplace);
  const detectedSnapshotDate=consistentColumnValue(dataRows,indexes.snapshotDate,value=>strictDate(value)||clean(value));
  const detectedReportVersion=consistentColumnValue(dataRows,indexes.reportVersion);
  const defaults={asin:detectedAsin||fallbackAsin,marketplace:detectedMarketplace||fallbackMarketplace,snapshotDate:detectedSnapshotDate||fallbackSnapshot,reportVersion:detectedReportVersion||fallbackVersion};
  const outputRows=[],previewRows=[],missing=new Set();
  const value=(row,field)=>indexes[field]==null?'':row[indexes[field]]??'';
  const metadata=(row,field,fallback)=>clean(value(row,field))||fallback;
  const addOutput=(row,asin,metrics={})=>{
    const keyword=clean(value(row,'keyword'));
    const marketplace=metadata(row,'marketplace',fallbackMarketplace);
    const snapshotRaw=metadata(row,'snapshotDate',fallbackSnapshot),snapshotDate=snapshotRaw?(strictDate(snapshotRaw)||snapshotRaw):'';
    const reportVersion=metadata(row,'reportVersion',fallbackVersion);
    if(!asin)missing.add('asin');
    if(!marketplace)missing.add('marketplace');
    if(!snapshotDate)missing.add('snapshotDate');
    const fixed=[
      asin,keyword,value(row,'volume'),metrics.organicRank??value(row,'organicRank'),metrics.sponsoredRank??value(row,'sponsoredRank'),metrics.trafficShare??value(row,'trafficShare'),metrics.conversionRate??value(row,'conversionRate'),
      marketplace,profile.provider,profile.reportType,reportVersion,snapshotDate,sourceFile
    ];
    const extras=unknownIndexes.map(index=>row[index]??'');
    outputRows.push([...fixed,...extras]);
    if(previewRows.length<5)previewRows.push({asin,keyword,searchVolume:fixed[2],organicRank:fixed[3],sponsoredRank:fixed[4],marketplace,snapshotDate});
  };
  for(const row of dataRows){
    const explicitAsin=clean(value(row,'asin')).toUpperCase();
    if(explicitAsin){addOutput(row,explicitAsin);continue;}
    if(wide.size){
      let expanded=false;
      for(const [asin,metricIndexes] of wide){
        const metrics={};let hasMetric=false;
        for(const [field,index] of Object.entries(metricIndexes)){const raw=row[index]??'';metrics[field]=raw;if(clean(raw))hasMetric=true;}
        if(hasMetric){addOutput(row,asin,metrics);expanded=true;}
      }
      if(expanded)continue;
    }
    addOutput(row,fallbackAsin);
  }
  const normalizedHeaders=[...PROFILE_FIXED_HEADERS,...unknownHeaders];
  const normalizedCsv=[csvRow(normalizedHeaders),...outputRows.map(csvRow)].join('\n');
  const mapping={
    ASIN:indexes.asin!=null?sourceHeader(headers,indexes.asin):(wide.size?`${wide.size} ASIN rank column${wide.size===1?'':'s'}`:(fallbackAsin?'Fallback ASIN':'')),
    Keyword:sourceHeader(headers,indexes.keyword),
    'Search Volume':sourceHeader(headers,indexes.volume),
    'Organic Rank':sourceHeader(headers,indexes.organicRank)||(wide.size?'ASIN-specific rank columns':''),
    'Sponsored Rank':sourceHeader(headers,indexes.sponsoredRank),
    'Traffic Share':sourceHeader(headers,indexes.trafficShare),
    'Conversion Rate':sourceHeader(headers,indexes.conversionRate)
  };
  return{
    profiled:true,profileId:profile.id,profileVersion:THIRD_PARTY_PROFILE_VERSION,provider:profile.provider,reportType:profile.reportType,reportVersion:defaults.reportVersion,
    sourceHeaders:[...headers],unknownHeaders,mapping,wideAsins:[...wide.keys()],defaults,missingMetadata:[...missing],canProfile:missing.size===0,normalizedCsv,previewRows,sourceFile
  };
}

return{MAX_IMPORT_BYTES,SUPPORTED_KINDS,SCHEMAS,THIRD_PARTY_PROFILE_VERSION,PROFILE_FIXED_HEADERS,THIRD_PARTY_PROFILES,parseCSV,strictDate,strictNumber,detectThirdPartyProfile,profileThirdPartyCsv,validateGrowthCsv};'''
          replace_once('growth-import-validation.js', validation_anchor, validation_add)

          replace_once('growth-import-gate.js', "let latestReport=null;", "let latestReport=null;\nlet pendingThirdParty=null;")

          old_render = r'''function renderReport(){
  if(!root?.document)return;
  document.getElementById('keywordos-growth-validation-report')?.remove();
  if(!latestReport)return;
  const content=document.getElementById('content');
  if(!content)return;
  const card=document.createElement('div');
  card.id='keywordos-growth-validation-report';
  card.className='notice-banner';
  const rejected=latestReport.rejectedCount>0
    ?` <button type="button" class="btn sm" id="keywordos-download-rejected-growth">Download rejected rows</button>`:'';
  card.innerHTML=`<b>Growth CSV validation:</b> ${escapeHtml(summaryText(latestReport))}. Only accepted rows are forwarded to the workspace parser.${rejected}`;
  const readiness=content.querySelector('.keywordos-import-readiness');
  if(readiness)readiness.insertAdjacentElement('afterend',card);else content.prepend(card);
  card.querySelector('#keywordos-download-rejected-growth')?.addEventListener('click',()=>downloadRejected(latestReport));
}'''
          new_render = r'''function compactList(values,limit=10){const list=Array.isArray(values)?values.filter(Boolean):[];return list.length>limit?`${list.slice(0,limit).join(', ')} +${list.length-limit} more`:list.join(', ')||'None';}
function renderReport(){
  if(!root?.document)return;
  document.getElementById('keywordos-growth-validation-report')?.remove();
  if(!latestReport)return;
  const content=document.getElementById('content');
  if(!content)return;
  const card=document.createElement('div');
  card.id='keywordos-growth-validation-report';
  card.className='notice-banner';
  const profile=latestReport.profile;
  if(latestReport.pending&&profile){
    const mappings=Object.entries(profile.mapping||{}).filter(([,source])=>source).map(([target,source])=>`${target} ← ${source}`);
    const previews=(profile.previewRows||[]).slice(0,3).map(row=>`${row.asin||'ASIN required'} · ${row.keyword||'Keyword missing'} · volume ${row.searchVolume||'—'} · organic ${row.organicRank||'—'} · sponsored ${row.sponsoredRank||'—'}`);
    const missing=profile.missingMetadata?.length?`<div><b>Required before import:</b> ${escapeHtml(profile.missingMetadata.join(', '))}</div>`:'';
    card.innerHTML=`<b>Third-party CSV profile:</b> ${escapeHtml(profile.provider)} · ${escapeHtml(profile.reportType)} · ${escapeHtml(profile.profileVersion)}<div><small>Mapped: ${escapeHtml(compactList(mappings,8))}</small></div><div><small>Preserved vendor columns: ${escapeHtml(compactList(profile.unknownHeaders,10))}</small></div>${missing}<div><small>Preview: ${escapeHtml(previews.join(' | ')||'No preview rows')}</small></div><div class="top-gap"><label>Fallback ASIN <input id="keywordos-profile-asin" value="${escapeHtml(profile.defaults?.asin||'')}" placeholder="10-character ASIN"></label> <label>Marketplace <input id="keywordos-profile-marketplace" value="${escapeHtml(profile.defaults?.marketplace||'')}" placeholder="US"></label> <label>Snapshot Date <input id="keywordos-profile-snapshot" type="date" value="${escapeHtml(profile.defaults?.snapshotDate||'')}"></label> <label>Report Version <input id="keywordos-profile-version" value="${escapeHtml(profile.defaults?.reportVersion||'')}" placeholder="optional"></label> <button type="button" class="btn primary" id="keywordos-confirm-third-party">Validate & import</button></div>`;
  }else{
    const rejected=latestReport.rejectedCount>0?` <button type="button" class="btn sm" id="keywordos-download-rejected-growth">Download rejected rows</button>`:'';
    const source=profile?` <small>Profile: ${escapeHtml(profile.provider)} · ${escapeHtml(profile.reportType)}; ${profile.unknownHeaders.length} vendor columns preserved.</small>`:'';
    card.innerHTML=`<b>Growth CSV validation:</b> ${escapeHtml(summaryText(latestReport))}. Only accepted rows are forwarded to the workspace parser.${rejected}${source}`;
  }
  const readiness=content.querySelector('.keywordos-import-readiness');
  if(readiness)readiness.insertAdjacentElement('afterend',card);else content.prepend(card);
  card.querySelector('#keywordos-download-rejected-growth')?.addEventListener('click',()=>downloadRejected(latestReport));
  card.querySelector('#keywordos-confirm-third-party')?.addEventListener('click',confirmThirdParty);
}'''
          replace_once('growth-import-gate.js', old_render, new_render)

          old_validate = r'''async function validateAndForward(input,kind,file){
  const validator=root?.KeywordOSGrowthImportValidation;
  if(!validator?.validateGrowthCsv){toast('Growth CSV validator is unavailable; import blocked.','error');return;}
  try{
    const text=await file.text();
    const report=validator.validateGrowthCsv(kind,text,{byteLength:file.size});
    latestReport=report;renderReport();
    if(!report.canImport){
      toast(`Growth CSV blocked: ${summaryText(report)}. Fix the rejected rows and re-import.`,'error');
      return;
    }
    input.files=sanitizedFile(file,report.acceptedCsv);
    input.dataset.keywordosGrowthValidated='1';
    if(report.rejectedCount)toast(`Growth CSV partially accepted: ${summaryText(report)}.`,'warn');
    input.dispatchEvent(new Event('change',{bubbles:true}));
  }catch(error){
    latestReport={kind,acceptedCount:0,rejectedCount:0,skippedCount:0,rejectedCsv:'',error:String(error?.message||error)};
    renderReport();
    toast(`Growth CSV blocked: ${latestReport.error}`,'error');
  }
}'''
          new_validate = r'''async function confirmThirdParty(){
  const pending=pendingThirdParty,validator=root?.KeywordOSGrowthImportValidation;
  if(!pending||!validator?.profileThirdPartyCsv)return;
  try{
    const metadata={
      asin:document.getElementById('keywordos-profile-asin')?.value||'',
      marketplace:document.getElementById('keywordos-profile-marketplace')?.value||'',
      snapshotDate:document.getElementById('keywordos-profile-snapshot')?.value||'',
      reportVersion:document.getElementById('keywordos-profile-version')?.value||'',
      sourceFile:pending.file.name||''
    };
    const profile=validator.profileThirdPartyCsv(pending.kind,pending.text,metadata);
    if(!profile?.canProfile){
      latestReport={kind:pending.kind,acceptedCount:0,rejectedCount:0,skippedCount:0,rejectedCsv:'',pending:true,profile};renderReport();
      toast(`Third-party CSV blocked: add ${profile?.missingMetadata?.join(', ')||'required metadata'}.`,'error');return;
    }
    const bytes=new TextEncoder().encode(profile.normalizedCsv).byteLength;
    const report=validator.validateGrowthCsv(pending.kind,profile.normalizedCsv,{byteLength:bytes});
    report.profile=profile;latestReport=report;
    if(!report.canImport){renderReport();toast(`Growth CSV blocked: ${summaryText(report)}. Fix the rejected rows and re-import.`,'error');return;}
    const {input,file}=pending;pendingThirdParty=null;
    input.files=sanitizedFile(file,report.acceptedCsv);input.dataset.keywordosGrowthValidated='1';
    if(report.rejectedCount)toast(`Growth CSV partially accepted: ${summaryText(report)}.`,'warn');
    input.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(renderReport,0);
  }catch(error){
    latestReport={kind:pending.kind,acceptedCount:0,rejectedCount:0,skippedCount:0,rejectedCsv:'',error:String(error?.message||error),pending:true,profile:pending.profile};renderReport();toast(`Third-party CSV blocked: ${latestReport.error}`,'error');
  }
}
async function validateAndForward(input,kind,file){
  const validator=root?.KeywordOSGrowthImportValidation;
  if(!validator?.validateGrowthCsv){toast('Growth CSV validator is unavailable; import blocked.','error');return;}
  try{
    if(file.size>validator.MAX_IMPORT_BYTES)throw new Error('Growth CSV exceeds the 16 MiB browser import limit');
    const text=await file.text();
    const profile=validator.profileThirdPartyCsv?.(kind,text,{sourceFile:file.name||''});
    if(profile){
      pendingThirdParty={input,kind,file,text,profile};
      latestReport={kind,acceptedCount:0,rejectedCount:0,skippedCount:0,rejectedCsv:'',pending:true,profile};renderReport();
      toast(`${profile.provider} CSV detected. Review mapped fields and source metadata before import.`,'info');return;
    }
    const report=validator.validateGrowthCsv(kind,text,{byteLength:file.size});
    latestReport=report;renderReport();
    if(!report.canImport){toast(`Growth CSV blocked: ${summaryText(report)}. Fix the rejected rows and re-import.`,'error');return;}
    input.files=sanitizedFile(file,report.acceptedCsv);input.dataset.keywordosGrowthValidated='1';
    if(report.rejectedCount)toast(`Growth CSV partially accepted: ${summaryText(report)}.`,'warn');
    input.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(renderReport,0);
  }catch(error){
    pendingThirdParty=null;latestReport={kind,acceptedCount:0,rejectedCount:0,skippedCount:0,rejectedCsv:'',error:String(error?.message||error)};renderReport();toast(`Growth CSV blocked: ${latestReport.error}`,'error');
  }
}'''
          replace_once('growth-import-gate.js', old_validate, new_validate)

