          new_reverse = "  if(kind==='reverse-asin'){const asin=String(pick(row,map,['ASIN','Child ASIN','Product ASIN'])).trim(),keyword=String(pick(row,map,['Keyword','Search Term','Query'])).trim();if(!asin||!keyword)continue;const known=new Set(['ASIN','Child ASIN','Product ASIN','Keyword','Search Term','Query','Search Volume','Volume','Search Query Volume','Organic Rank','Natural Rank','Sponsored Rank','Ad Rank','Traffic Share','Click Share','Conversion Rate','CVR','Marketplace','Market','Amazon Marketplace','Provider','Source Provider','Report Type','Source Report','Report Version','Source Report Version','Snapshot Date','Data Date','Date','Source File','File Name'].map(norm)),sourceColumns={};parsed[0].forEach((header,index)=>{const label=String(header||'').trim();if(label&&!known.has(norm(label))&&String(row[index]??'').trim()!=='')sourceColumns[label]=row[index]??''});out.push({asin,keyword,volume:num(pick(row,map,['Search Volume','Volume','Search Query Volume'])),organicRank:num(pick(row,map,['Organic Rank','Natural Rank'])),sponsoredRank:num(pick(row,map,['Sponsored Rank','Ad Rank'])),trafficShare:ratio(pick(row,map,['Traffic Share','Click Share'])),conversionRate:ratio(pick(row,map,['Conversion Rate','CVR'])),marketplace:String(pick(row,map,['Marketplace','Market','Amazon Marketplace'])).trim(),provider:String(pick(row,map,['Provider','Source Provider'])).trim(),reportType:String(pick(row,map,['Report Type','Source Report'])).trim(),reportVersion:String(pick(row,map,['Report Version','Source Report Version'])).trim(),snapshotDate:date(pick(row,map,['Snapshot Date','Data Date','Date'])),sourceFile:String(pick(row,map,['Source File','File Name'])).trim(),sourceColumns});}"
