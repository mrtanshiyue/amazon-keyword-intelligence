name: Third Party CSV Profile Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/third-party-csv-profile-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recover and apply guarded patch
        shell: bash
        run: |
          git show HEAD^^:.github/workflows/third-party-csv-profile-once.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/third-party-profile-patch.py
          test -s /tmp/third-party-profile-patch.py
          python /tmp/third-party-profile-patch.py
      - name: Diagnose SellerSprite mapping
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          await import('./growth-workspaces.js');
          await import('./growth-import-validation.js');
          const v=globalThis.KeywordOSGrowthImportValidationTest;
          const g=globalThis.KeywordOSGrowthTest;
          const csv='Keyword,Searches/M,Organic Position,SP Rank,Impression Share,Conversion,SPR,DSR\nreading glasses,1500,5,3,12%,8%,22,4.5';
          const p=v.profileThirdPartyCsv('reverse-asin',csv,{asin:'B000000003',marketplace:'US',snapshotDate:'2026-09-03',reportVersion:'web-export'});
          console.log('PROFILE', JSON.stringify({mapping:p.mapping,unknown:p.unknownHeaders,normalized:p.normalizedCsv}));
          const checked=v.validateGrowthCsv('reverse-asin',p.normalizedCsv);
          console.log('PARSED',JSON.stringify(g.parseKind('reverse-asin',checked.acceptedCsv)));
          NODE
          exit 1
