name: Keyword Lab Roots Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/keyword-lab-roots-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded Keyword Lab roots patch
        run: |
          python .github/scripts/keyword-lab-roots-once.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/keyword-lab.test.mjs')
          text = path.read_text()
          old = "assert.deepEqual(lab.extractNgrams('reading glasses for women', '2', { ignoreStopwords:true }), ['reading glasses','glasses for']);"
          new = "assert.deepEqual(lab.extractNgrams('reading glasses for women', '2', { ignoreStopwords:true }), ['reading glasses']);"
          if text.count(old) != 1:
              raise SystemExit(f'stopword expectation: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Check and build
        run: |
          npm run check
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app.js keyword-lab.js ui-capability-guard.js tests/keyword-lab.test.mjs tests/ui-capability-guard.test.mjs dist
          git diff --cached --check
          git commit -m "feat: add Keyword Lab n-gram workspace"
          git push origin HEAD:main
