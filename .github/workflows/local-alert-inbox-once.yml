name: Local Alert Inbox Once

on:
  push:
    paths:
      - '.github/scripts/local-alert-inbox-once.py'
      - '.github/workflows/local-alert-inbox-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded alert inbox patch
        run: python .github/scripts/local-alert-inbox-once.py
      - name: Preserve existing relevance build contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('package.json'); text=p.read_text()
          old='growth-import-validation.js && node --check keyword-relevance-review.js && node --check alert-inbox.js && node --check growth-import-gate.js'
          new='growth-import-validation.js && node --check alert-inbox.js && node --check keyword-relevance-review.js && node --check growth-import-gate.js'
          if text.count(old)!=1: raise SystemExit(f'package check sequence: expected one match, found {text.count(old)}')
          text=text.replace(old,new,1)
          old='growth-import-validation.js keyword-relevance-review.js alert-inbox.js growth-import-gate.js'
          new='growth-import-validation.js alert-inbox.js keyword-relevance-review.js growth-import-gate.js'
          if text.count(old)!=1: raise SystemExit(f'package build sequence: expected one match, found {text.count(old)}')
          text=text.replace(old,new,1); p.write_text(text)
          p=Path('tests/alert-inbox.test.mjs'); text=p.read_text()
          old="assert.match(pkg, /keyword-relevance-review\\.js alert-inbox\\.js growth-import-gate\\.js/);"
          new="assert.match(pkg, /alert-inbox\\.js keyword-relevance-review\\.js growth-import-gate\\.js/);"
          if text.count(old)!=1: raise SystemExit(f'alert test sequence: expected one match, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Focused alert inbox tests
        run: node --test tests/alert-inbox.test.mjs tests/dataset-registry.test.mjs tests/rank-snapshots.test.mjs
      - name: Full check
        shell: bash
        run: |
          set -o pipefail
          npm run check | tee /tmp/check.log
          TEST_COUNT=$(grep -E '^# tests [0-9]+$' /tmp/check.log | tail -1 | awk '{print $3}')
          test -n "$TEST_COUNT"
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"
      - name: Build static assets
        shell: bash
        run: |
          set -o pipefail
          npm run build | tee /tmp/build.log
          JS_COUNT=$(grep -E 'Static asset closure OK \([0-9]+ script modules \+ [0-9]+ stylesheets referenced\)\.' /tmp/build.log | tail -1 | sed -E 's/.*\(([0-9]+) script modules.*/\1/')
          PUBLISH_COUNT=$(grep -E 'Source/dist byte identity OK \([0-9]+ publish files\)\.' /tmp/build.log | tail -1 | sed -E 's/.*\(([0-9]+) publish files\).*/\1/')
          test -n "$JS_COUNT"
          test -n "$PUBLISH_COUNT"
          echo "JS_COUNT=$JS_COUNT" >> "$GITHUB_ENV"
          echo "PUBLISH_COUNT=$PUBLISH_COUNT" >> "$GITHUB_ENV"
      - name: Finalize README verification counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md'); text=p.read_text()
          for old,new in {'__TEST_COUNT__':os.environ['TEST_COUNT'],'__JS_COUNT__':os.environ['JS_COUNT'],'__PUBLISH_COUNT__':os.environ['PUBLISH_COUNT']}.items():
              if text.count(old)!=1: raise SystemExit(f'{old}: expected one placeholder, found {text.count(old)}')
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app.js alert-inbox.js dataset-registry.js growth-workspaces.js index.html local-operations-actions.js package.json tests/alert-inbox.test.mjs tests/dataset-registry.test.mjs dist
          git diff --cached --check
          git commit -m "feat: add local snapshot alert inbox"
          git push origin HEAD:main
