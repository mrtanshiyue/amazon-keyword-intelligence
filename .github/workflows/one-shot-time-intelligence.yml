name: One-shot Time Intelligence completion

on:
  push:
    branches:
      - feature/p1-time-intelligence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p1-time-intelligence
          fetch-depth: 0

      - name: Apply Time Intelligence patch
        run: python scripts/patch-time-intelligence.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Time Intelligence contracts
        run: |
          npm run check
          grep -q "keywordos_v9_dashboard_ui" app.js
          grep -q "data-dashboard-granularity" app.js
          grep -q "trendMetrics(rows,state.dashboardUi.granularity)" app.js
          grep -q "function openSearchTermHistory" app.js
          grep -q "data-term-history" app.js
          grep -q "Placements · unavailable" app.js
          grep -q "Real imported history only" app.js
          ! grep -q "Daily is the only aggregation available" app.js
          ! grep -q "History · Preview" app.js
          ! grep -q "Search-term history view is not implemented yet" app.js

      - name: Enforce deferred-auth boundary
        run: |
          git diff --exit-code origin/main -- src/worker.js src/access-auth.js src/store-authorization.js migrations

      - name: Build static assets
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Commit product patch and remove one-shot assets
        run: |
          rm scripts/patch-time-intelligence.py
          rm .github/workflows/one-shot-time-intelligence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/patch-time-intelligence.py .github/workflows/one-shot-time-intelligence.yml
          git commit -m "Complete Dashboard granularity and search-term history"
          git push origin HEAD:feature/p1-time-intelligence
