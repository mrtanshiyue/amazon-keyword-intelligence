name: Keyword Lab Canonicalize Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/keyword-lab-canonicalize-once.yml

permissions:
  contents: write

concurrency:
  group: keyword-lab-canonicalize-once
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonicalize Keyword Lab identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in {path}, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'navigation-taxonomy.js',
              "['cerebro','keywords','keywords','⌕','Keyword Research','Keyword Research','Research and qualify keyword opportunities using Amazon advertising search-term data.','core',70]",
              "['cerebro','keywords','keywords','⌕','Keyword Lab','Keyword Lab','Discover, batch-analyze, and compare loaded keyword evidence through one source-aware result model.','core',70]",
              'registry canonical label',
          )

          replace_once(
              'product-language.js',
              "  const KEYWORD_RESEARCH_LABEL='Keyword Research';",
              "  const KEYWORD_LAB_LABEL='Keyword Lab';\n  const KEYWORD_RESEARCH_LABEL=KEYWORD_LAB_LABEL;",
              'keyword lab label constant',
          )
          replace_once(
              'product-language.js',
              "    'cerebro':['关键词研究','关键词研究','使用 Amazon 广告搜索词数据研究并筛选关键词机会'],",
              "    'cerebro':['关键词实验室','关键词实验室','使用统一来源模型进行关键词发现、批量分析与 ASIN 导入对比'],",
              'keyword lab Chinese page language',
          )
          replace_once(
              'product-language.js',
              "if(clean(page)===LEGACY_KEYWORD_ROUTE&&value.trim()===LEGACY_KEYWORD_LABEL)return KEYWORD_RESEARCH_LABEL;",
              "if(clean(page)===LEGACY_KEYWORD_ROUTE&&value.trim()===LEGACY_KEYWORD_LABEL)return KEYWORD_LAB_LABEL;",
              'legacy product label mapping',
          )
          replace_once(
              'product-language.js',
              "function replaceLegacyKeywordLabel(value){return String(value??'').replace(/\\bCerebro\\b/g,KEYWORD_RESEARCH_LABEL);}",
              "function replaceLegacyKeywordLabel(value){return String(value??'').replace(/\\bCerebro\\b/g,KEYWORD_LAB_LABEL);}",
              'legacy text canonicalization',
          )
          replace_once(
              'product-language.js',
              "const canonical=replaceLegacyKeywordLabel(before),translated=mode==='zh'?canonical.replace(/Keyword Research/g,'关键词研究'):mode==='bi'?canonical.replace(/Keyword Research/g,'关键词研究 / Keyword Research'):canonical;",
              "const canonical=replaceLegacyKeywordLabel(before),translated=mode==='zh'?canonical.replace(/Keyword Lab/g,'关键词实验室'):mode==='bi'?canonical.replace(/Keyword Lab/g,'关键词实验室 / Keyword Lab'):canonical;",
              'legacy text localization',
          )
          replace_once(
              'product-language.js',
              "const api={LEGACY_KEYWORD_ROUTE,LEGACY_KEYWORD_LABEL,KEYWORD_RESEARCH_LABEL,SUITE_ZH",
              "const api={LEGACY_KEYWORD_ROUTE,LEGACY_KEYWORD_LABEL,KEYWORD_LAB_LABEL,KEYWORD_RESEARCH_LABEL,SUITE_ZH",
              'product language API label',
          )

          replace_once(
              'tests/page-registry.test.mjs',
              "  assert.equal(research.navLabel, 'Keyword Research');\n  assert.equal(research.title, 'Keyword Research');",
              "  assert.equal(research.navLabel, 'Keyword Lab');\n  assert.equal(research.title, 'Keyword Lab');\n  assert.equal(registry.commandEntries().find(entry => entry.page === 'cerebro')?.label, 'Keyword Lab');\n  assert.equal(registry.commandEntries().some(entry => entry.label === 'Keyword Research'), false);",
              'page registry keyword lab regression',
          )

          replace_once(
              'tests/product-language.test.mjs',
              "test('renames the legacy Cerebro user label while preserving the internal route id', () => {\n  assert.equal(language.LEGACY_KEYWORD_ROUTE, 'cerebro');\n  assert.equal(registry.page('cerebro').navLabel, 'Keyword Research');\n  assert.equal(registry.page('cerebro').title, 'Keyword Research');\n  assert.equal(language.productLabel('cerebro', 'Cerebro'), 'Keyword Research');",
              "test('maps the legacy Cerebro route to the canonical Keyword Lab label while preserving the internal route id', () => {\n  assert.equal(language.LEGACY_KEYWORD_ROUTE, 'cerebro');\n  assert.equal(registry.page('cerebro').navLabel, 'Keyword Lab');\n  assert.equal(registry.page('cerebro').title, 'Keyword Lab');\n  assert.equal(language.productLabel('cerebro', 'Cerebro'), 'Keyword Lab');",
              'product language canonical label regression',
          )
          replace_once(
              'tests/product-language.test.mjs',
              "  assert.equal(language.replaceLegacyKeywordLabel('KEYWORDS / Cerebro'), 'KEYWORDS / Keyword Research');\n  assert.equal(language.replaceLegacyKeywordLabel('Cerebro keyword research'), 'Keyword Research keyword research');",
              "  assert.equal(language.replaceLegacyKeywordLabel('KEYWORDS / Cerebro'), 'KEYWORDS / Keyword Lab');\n  assert.equal(language.replaceLegacyKeywordLabel('Cerebro keyword research'), 'Keyword Lab keyword research');",
              'legacy keyword label regression',
          )
          replace_once(
              'tests/product-language.test.mjs',
              "test('page language supports English, Chinese and bilingual shell text from the same registry id', () => {\n  assert.equal(language.pageLanguage('rank-intelligence', 'en').title, 'Rank & Index Tracker');",
              "test('page language supports English, Chinese and bilingual shell text from the same registry id', () => {\n  assert.equal(language.pageLanguage('cerebro', 'en').title, 'Keyword Lab');\n  assert.equal(language.pageLanguage('cerebro', 'zh').title, '关键词实验室');\n  assert.equal(language.pageLanguage('cerebro', 'bi').title, '关键词实验室 / Keyword Lab');\n  assert.equal(language.pageLanguage('rank-intelligence', 'en').title, 'Rank & Index Tracker');",
              'keyword lab bilingual shell regression',
          )

          replace_once(
              'README.md',
              '| [ui-capability-guard.js](./ui-capability-guard.js) | 按钮能力契约、Rule-based Bids 命名、Keyword Research 可见能力与实际行为一致性 | ✅ 未接线按钮 fail-closed；Keyword Research 未实现能力准确改名/隐藏 |',
              '| [ui-capability-guard.js](./ui-capability-guard.js) | 按钮能力契约、Rule-based Bids 命名、Keyword Lab 可见能力与实际行为一致性 | ✅ 未接线按钮 fail-closed；Keyword Lab 未实现能力准确改名/隐藏 |',
              'README capability guard identity',
          )
          replace_once(
              'README.md',
              '| [keyword-lab.js](./keyword-lab.js) | Keyword Lab 三模式运行时壳与 source-aware 统一结果契约 | 🟡 Ads / SQP / reverse-ASIN / ranks / keyword-assets 已按 exact keyword 合并且冲突指标保留来源；canonical 页面身份尚未迁移 |',
              '| [keyword-lab.js](./keyword-lab.js) | Keyword Lab 三模式运行时壳与 source-aware 统一结果契约 | ✅ 三模式、五来源 exact merge、source-aware 指标冲突与 canonical Keyword Lab 页面身份已统一 |',
              'README keyword lab file status',
          )
          replace_once(
              'README.md',
              '- 🟡 Keyword Lab foundation 已接入：',
              '- ✅ Keyword Lab 核心基础已接入：',
              'README keyword lab foundation status',
          )
          replace_once(
              'README.md',
              '`keyword-lab.js` 在现有 `cerebro` 研究页与 `asin-comparison` 之间提供',
              '`keyword-lab.js` 在兼容 `cerebro` route 与 `asin-comparison` 之间提供',
              'README keyword lab route wording',
          )
          replace_once(
              'README.md',
              '- 🟡 中央 Page Registry、侧栏、command palette、页面标题与 breadcrumb 当前仍以 **Keyword Research** 作为 canonical 页面身份；内部 `cerebro` route 继续保留。后续完成 Keyword Lab 身份迁移时必须继续由 registry id 驱动，而不是按可见文本改写。',
              '- ✅ 中央 Page Registry、侧栏、command palette、页面标题与 breadcrumb 已统一使用 **Keyword Lab** canonical 页面身份；内部 `cerebro` route 仅保留兼容，不再拥有独立产品命名。EN / 中文 / 双语 shell 继续由 registry id 驱动。',
              'README canonical identity status',
          )
          replace_once(
              'README.md',
              '- ✅ Keyword Research 的 Word Frequency / Learn / Search / Settings 工具按钮按 canonical `cerebro` route id 直接接线，不依赖可见标题；Batch Analysis、Word Frequency 与隐藏保存预设的状态同样由该 route 的 truth pass 驱动。',
              '- ✅ Keyword Lab 的 Word Frequency / Learn / Search / Settings 工具按钮按 canonical `cerebro` route id 直接接线，不依赖可见标题；Batch Analysis、Word Frequency 与隐藏保存预设的状态同样由该 route 的 truth pass 驱动。',
              'README keyword lab tool wording',
          )
          replace_once(
              'README.md',
              '| Cerebro 两标签：Find Suggestions 与 Analyze Keywords；后者最多 200 词，可从 My List 进入 | 保留两模式，但共用来源、筛选、摘要和结果表 | 🟡 本地 ≤200 Batch 已实现四类输入、五来源 exact keyword evidence merge 与 left join；保存筛选、完整列视图和统一页面身份仍不足 |',
              '| Cerebro 两标签：Find Suggestions 与 Analyze Keywords；后者最多 200 词，可从 My List 进入 | 保留两模式，但共用来源、筛选、摘要和结果表 | 🟡 本地 ≤200 Batch 已实现四类输入、五来源 exact keyword evidence merge 与 left join，统一页面身份已完成；保存筛选和完整列视图仍不足 |',
              'README competitor gap identity',
          )
          replace_once(
              'README.md',
              '- [ ] 把 Keyword Research 升级为一个 Keyword Lab，保留“关键词发现 / 批量分析 / ASIN 导入与对比”三种模式和一套结果模型。',
              '- [x] 把 Keyword Research 升级为一个 Keyword Lab，保留“关键词发现 / 批量分析 / ASIN 导入与对比”三种模式和一套结果模型。',
              'README P1 canonical task completion',
          )
          replace_once(
              'README.md',
              '  - 2026-09-03 进展：`keyword-lab.js` 已建立三模式壳、≤200 Batch、统一五来源关键词证据与 source-aware metric collision 规则；Discovery、Batch 和 ASIN Compare 现在都消费同一结果 shape。中央 Page Registry 仍显示 Keyword Research，因此本项继续保持未完成。当前 CI 为 **325 passed / 0 failed**；`npm run build` 验证 **42 个 JS + 9 个 CSS，52 个发布文件**，source/dist byte identity 与 committed-dist parity gate 全部通过。',
              '  - 2026-09-03：`keyword-lab.js` 已建立三模式壳、≤200 Batch、统一五来源关键词证据与 source-aware metric collision 规则；Discovery、Batch 和 ASIN Compare 继续消费同一结果 shape。`navigation-taxonomy.js` 已把 canonical `cerebro` 页面产品名统一为 **Keyword Lab**，`product-language.js` 同步 EN / 中文 / 双语 shell；内部 route id 继续兼容。CI 为 **325 passed / 0 failed**；`npm run build` 验证 **42 个 JS + 9 个 CSS，52 个发布文件**，source/dist byte identity 与 committed-dist parity gate 全部通过。',
              'README P1 canonical task note',
          )
          PY

      - name: Check and test
        run: npm run check

      - name: Build static assets
        run: npm run build

      - name: Verify generated release tree
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all -- dist | grep '^??' || true)"

      - name: Commit completed task
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md navigation-taxonomy.js product-language.js tests/page-registry.test.mjs tests/product-language.test.mjs dist
          git commit -m "feat: canonicalize Keyword Lab page identity"
          git push origin HEAD:main
