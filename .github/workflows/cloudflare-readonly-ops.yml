name: Cloudflare Read-Only Ops

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches:
      - chore/cloudflare-readonly-ops

permissions:
  contents: read

concurrency:
  group: cloudflare-readonly-ops
  cancel-in-progress: false

jobs:
  status:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 63 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/cloudflare status')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify configured secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN=FAIL"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID=FAIL"; exit 3; }
          echo "CLOUDFLARE_API_TOKEN=PASS"
          echo "CLOUDFLARE_ACCOUNT_ID=PASS"

      - name: Probe Cloudflare read capabilities
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          probe() {
            local label="$1"
            local url="$2"
            local body code success
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            success="$(jq -r '.success // false' "$body" 2>/dev/null || echo false)"
            rm -f "$body"

            if [ "$code" = "200" ] && [ "$success" = "true" ]; then
              echo "${label}=PASS"
              return 0
            fi

            echo "${label}=FAIL"
            return 1
          }

          probe TOKEN_VERIFY "https://api.cloudflare.com/client/v4/user/tokens/verify"
          probe WORKERS_SCRIPTS_READ "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          probe D1_DATABASES_READ "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          probe R2_BUCKETS_READ "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets"
